<link rel="stylesheet" href="stylesheet.css">
<head>
  <title>Settings</title>
  <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<html>
<center><h1><big>Settings</big></h1></center><br>
<h2><center><big>Account settings</big></center></h2>
<center>
<form id='pfpurl'>profile picture url:<input type="text" id="url"><button type="submit">submit</button></form>
<form id='bgcolor'>profile color:<input type="color" id="color"><button type="submit">submit</button></form>
<form id='email'>connect email:<input type="text" id="email2"><button type="submit">submit</button></form>
<form id='bio'>create a bio:<input type="text" id="bio2"><button type="submit">submit</button></form>

<button id="logoutBtn">Sign out?</button>

</center>
<script>
    const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
    const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
    async function checkExistingSession() {
    const { data: { session } } = await supabaser.auth.getSession();
    if (!session) {
        alert("hey you aint meant to be e're! get 'em boys!!")
        window.location.href = "index.html"; 
    }
    }
    checkExistingSession();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaser.auth.signOut();
        alert("Logged out successfully.");
        window.location.reload();
    });


    document.getElementById('pfpurl').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newurl = document.getElementById('url').value.trim();
        if (!newurl.startsWith('http://') && !newurl.startsWith('https://')) {
            alert("plz use a url starting with http:// next time okie? <3");
            return;
        }
        const { data: { session } } = await supabaser.auth.getSession();
        if (session) {
            const { error } = await supabaser
                .from('profiles')
                .update({ avatar_url: newurl }) 
                .eq('id', session.user.id);

            if (error) {
                alert("Failed to update profile picture: " + error.message);
                console.error(error);
            } else {
                alert("Profile picture updated successfully!");
                document.getElementById('url').value = "";
            }
        }
    });
    document.getElementById('bgcolor').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newbgc = document.getElementById('color').value.trim();
        const { data: { session } } = await supabaser.auth.getSession();
        if (session) {
            const { error } = await supabaser
                .from('profiles')
                .update({ bgcolor: newbgc }) 
                .eq('id', session.user.id);

            if (error) {
                alert("Failed to update profile color: " + error.message);
                console.error(error);
            } else {
                alert("Profile color updated successfully!");
                document.getElementById('bgcolor').value = "";
            }
        }
    });
    document.getElementById('email').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newemail = document.getElementById('email2').value.trim();
        if (!newemail.contains('@')) {
            alert("plz use a valid email next time okie? <3");
            return;
        }
        const { data: { session } } = await supabaser.auth.getSession();
        if (session) {
            const { error } = await supabaser
                .from('profiles')
                .update({ email: newemail }) 
                .eq('id', session.user.id);

            if (error) {
                alert("Failed to update email: " + error.message);
                console.error(error);
            } else {
                alert("Email updated successfully!");
                document.getElementById('email').value = "";
            }
        }
    });
    document.getElementById('bio').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newbio = document.getElementById('bio2').value.trim();
        const { data: { session } } = await supabaser.auth.getSession();
        if (session) {
            const { error } = await supabaser
                .from('profiles')
                .update({ bio: newbio }) 
                .eq('id', session.user.id);

            if (error) {
                alert("Failed to update bio: " + error.message);
                console.error(error);
            } else {
                alert("bio updated successfully!");
                document.getElementById('bio').value = "";
            }
        }
    });
</script>
</html>
