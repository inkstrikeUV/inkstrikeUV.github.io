<html>
<head>
  <title>Shop</title>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="icon" type="image/x-icon" href="icon.ico">

</head>
<header>
  <div class="header-left">
    <div id="loginlink">
      <a href="loginpage.html" style="color:#300385">sign in</a>
    </div>
    <div id="accountlink" style="display: none;">
      <a href="profile.html" style="color:#300385"><span id="username-display">Loading...</span></a>
    </div>
    <div class="money-container">
      total money:<span id="money-display">Loading...</span>
    </div>
  </div>

  <div class="header-center">
    <a href="../index.html" style="color:#300385">hoam :3</a>
  </div>

  <div class="header-right">

    <div class="notification-wrapper">
      <a href="notifications.html">
        <img src="bell.png" height="50" width="50" alt="Notifications">

<body>

</body>
<script>
const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let money = 0;
async function initPage() {
    const { data: { session } } = await supabaser.auth.getSession();
    
    if (session) {
        document.getElementById('loginlink').style.display = 'none';
        document.getElementById('accountlink').style.display = 'block';
        const { data, error } = await supabaser
            .from('profiles')
            .select('money, username')
            .eq('id', session.user.id)
            .single();
        if (data) {
            money = data.money;
            document.getElementById("money-display").innerText = money;
            
            document.getElementById("username-display").innerText = data.username || "User";
        } else if (error) {
            console.error("Database error:", error.message);
            document.getElementById("money-display").innerText = "Error";
        } // 2. Fetch notifications count and alternate image asset logic
            const { count, error: notiError } = await supabaser
                .from('notifications')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', session.user.id)
                .eq('is_read', false); // Assumes you tracking unread notifications

            if (!notiError && count > 0) {
                const badge = document.getElementById("notiBadge");
                const bellImg = document.getElementById("bellImg");
                
                badge.innerText = count;
                badge.style.display = "flex";
                
                bellImg.src = "notif.png"; 
            }
            
        } else {
            window.location.href = "loginpage.html";
        }
    }

document.addEventListener("DOMContentLoaded", function() {
    initPage();
});
let lastScrollY = window.scrollY;
const customHeader = document.querySelector('header');

window.addEventListener('scroll', () => {
    if (window.scrollY > lastScrollY && window.scrollY > 50) {
        customHeader.classList.add('hidden');
    } else {
        customHeader.classList.remove('hidden');
    }
    lastScrollY = window.scrollY;
});
</script>
</body>
</html>
