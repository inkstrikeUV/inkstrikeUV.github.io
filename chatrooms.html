<html>
<head>
  <title>Chatrooms</title>
  <link rel="stylesheet" href="chatroomstyle.css">
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="site-header"></div>
    <script src="header.js" defer></script>
  <div class="chat-layout">
    <aside class="chat-sidebar">
      <h2>Chatrooms</h2>

      <button onclick="showTab('public')">Public</button>
      <button onclick="showTab('private')">Private</button>
      <button onclick="showTab('archives')">Archives</button>
      <button onclick="showTab('dms')">DMs</button>
      <button onclick="showTab('create')">Make Chatroom</button>

      <hr>
    </aside>

    <main id="chat-content"></main>
  </div>
<script>
var link = document.querySelector("link[rel~='icon']");
if (!link) {
   link = document.createElement('link');
   link.rel = 'icon';
   document.head.appendChild(link);
}



function toggleInlineRoomEditor(room, roomDiv) {
    document.querySelectorAll(".room-editor").forEach(editor => {
        editor.remove();
    });

    document.querySelectorAll(".chatroom-entry").forEach(entry => {
        delete entry.dataset.editorOpen;
    });

    if (roomDiv.dataset.editorOpen === "true") {
        delete roomDiv.dataset.editorOpen;
        return;
    }

    roomDiv.dataset.editorOpen = "true";

    const editor = document.createElement("div");
    editor.className = "room-editor";

    const fields = document.createElement("div");
    fields.className = "room-edit-fields";

    function makeTextField(labelText, placeholder, dataAttribute, value = "") {
        const label = document.createElement("label");
        label.textContent = labelText;

        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = placeholder;
        input.value = value;
        input.dataset[dataAttribute] = "";
        input.autocomplete = "off";

        label.appendChild(input);
        fields.appendChild(label);
        return input;
    }

    makeTextField(
        "Change name:",
        "New chatroom name",
        "editRoomName",
        room.name
    ).maxLength = 50;

    
    const addInput = makeTextField(
        "Add Member:",
        "Enter username to add",
        "addMemberUsername"
    );

    const removeInput = makeTextField(
        "Remove Member:",
        "Enter username to remove",
        "removeMemberUsername"
    );

    function addMemberAction(input, labelText, action) {
        const label = input.parentElement;
        label.classList.add("member-field");
    
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = labelText;
        button.onclick = async () => {
            const username = input.value.trim();
    
            if (!username) {
                alert("Please enter a username.");
                input.focus();
                return;
            }
    
            button.disabled = true;
    
            try {
                const result = await changePrivateRoomMember(
                    room.id,
                    username,
                    action,
                    (await sharedSupabase.auth.getSession()).data.session?.user.id
                );
    
                if (!result.ok) {
                    alert(result.message);
                    return;
                }
    
                alert(result.message);
                input.value = "";
            } catch (error) {
                console.error("Member update failed:", error);
                alert("Could not update the member. Please try again.");
            } finally {
                button.disabled = false;
            }
        };
    
        label.appendChild(button);
    }

    addMemberAction(addInput, "Add", "add");
    addMemberAction(removeInput, "Remove", "remove");


    const privacyField = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = "Change Privacy:";
    privacyField.appendChild(legend);

    ["public", "private"].forEach(type => {
        const label = document.createElement("label");
        const radio = document.createElement("input");

        radio.type = "radio";
        radio.name = `privacy-${room.id}`;
        radio.value = type;
        radio.checked = room.privacy_type === type;

        label.appendChild(radio);
        label.appendChild(
            document.createTextNode(
                type === "public" ? " Public " : " Private "
            )
        );

        privacyField.appendChild(label);
    });

    fields.appendChild(privacyField);

    const actions = document.createElement("div");
    actions.className = "room-edit-status";

    const statusButton = document.createElement("button");
    statusButton.textContent = room.closed
        ? "Reopen Chatroom"
        : "Close Chatroom";

    statusButton.onclick = () =>
        toggleInlineChatroomClosed(room.id, room.closed);

    const saveButton = document.createElement("button");
    saveButton.textContent = "Save";
    saveButton.onclick = () => saveInlineChatroomEdits(room, roomDiv);

    actions.appendChild(statusButton);
    actions.appendChild(saveButton);

    const statusMessage = document.createElement("p");
    statusMessage.className = "room-edit-message";
    statusMessage.setAttribute("aria-live", "polite");
    actions.appendChild(statusMessage);

    editor.appendChild(fields);
    editor.appendChild(actions);
    roomDiv.appendChild(editor);
}



async function saveInlineChatroomEdits(room, roomDiv) {
    const nameInput = roomDiv.querySelector("[data-edit-room-name]");
    const addInput = roomDiv.querySelector("[data-add-member-username]");
    const removeInput = roomDiv.querySelector("[data-remove-member-username]");
    const privacyInput = roomDiv.querySelector(
        `input[name="privacy-${room.id}"]:checked`
    );
    const message = roomDiv.querySelector(".room-edit-message");
    const saveButton = roomDiv.querySelector(".room-edit-status button:last-of-type");

    const newName = nameInput?.value.trim();
    const addUsername = addInput?.value.trim();
    const removeUsername = removeInput?.value.trim();
    const newPrivacy = privacyInput?.value;

    if (!newName) {
        alert("Please enter a chatroom name.");
        return;
    }

    if (!newPrivacy) {
        alert("Please select a privacy option.");
        return;
    }

    if (newPrivacy !== "private" && (addUsername || removeUsername)) {
        alert("Member management is only available for private chatrooms. Clear the member fields or keep the room private.");
        return;
    }

    const { data: { session } } = await sharedSupabase.auth.getSession();

    if (!session) {
        alert("Please log in first.");
        return;
    }

    const { data: currentRoom, error: roomError } = await sharedSupabase
        .from("chatrooms")
        .select("id, creator_id")
        .eq("id", room.id)
        .single();

    if (roomError || !currentRoom) {
        alert("Could not find this chatroom.");
        return;
    }

    if (currentRoom.creator_id !== session.user.id) {
        alert("You aren't the owner of this chatroom.");
        return;
    }

    if (saveButton) saveButton.disabled = true;
    if (message) message.textContent = "Saving...";

    try {
        const { error: updateError } = await sharedSupabase
            .from("chatrooms")
            .update({
                name: newName,
                privacy_type: newPrivacy
            })
            .eq("id", room.id);

        if (updateError) throw updateError;

        // Ensure the owner has a membership row when the room is private.
        if (newPrivacy === "private") {
            const { data: ownerMembership, error: ownerCheckError } =
                await sharedSupabase
                    .from("chatroom_allowed_users")
                    .select("user_id")
                    .eq("chatroom_id", room.id)
                    .eq("user_id", session.user.id)
                    .maybeSingle();

            if (ownerCheckError) throw ownerCheckError;

            if (!ownerMembership) {
                const { error: ownerInsertError } = await sharedSupabase
                    .from("chatroom_allowed_users")
                    .insert({
                        chatroom_id: room.id,
                        user_id: session.user.id,
                        last_read_sequence: 0,
                        status: "member"
                    });

                if (ownerInsertError) throw ownerInsertError;
            }
        }

        const changes = [];

        if (addUsername) {
            changes.push(
                await changePrivateRoomMember(
                    room.id, addUsername, "add", session.user.id
                )
            );
        }

        if (removeUsername) {
            changes.push(
                await changePrivateRoomMember(
                    room.id, removeUsername, "remove", session.user.id
                )
            );
        }

        const failures = changes.filter(result => !result.ok);

        if (failures.length) {
            const details = failures.map(result => result.message).join("\n");
            alert(
                "The chatroom settings were saved, but a member change failed:\n" +
                details
            );
            return;
        }

        alert("Chatroom and member changes saved!");

        showTab(newPrivacy === "private" ? "private" : "public");
    } catch (error) {
        console.error("Could not save chatroom changes:", error);
        alert("Could not save changes: " + error.message);
    } finally {
        if (saveButton) saveButton.disabled = false;
        if (message) message.textContent = "";
    }
}


async function changePrivateRoomMember(roomId, username, action, ownerId) {
    const { data: profile, error: profileError } = await sharedSupabase
        .from("profiles")
        .select("id, username")
        .ilike("username", username)
        .maybeSingle();

    if (profileError) {
        return { ok: false, message: `Could not look up "${username}".` };
    }

    if (!profile) {
        return { ok: false, message: `Username "${username}" was not found.` };
    }

    if (profile.id === ownerId) {
        return {
            ok: false,
            message: "You cannot add or remove yourself as a member."
        };
    }

    const { data: room, error: roomError } = await sharedSupabase
        .from("chatrooms")
        .select("creator_id, privacy_type")
        .eq("id", roomId)
        .single();

    if (roomError || !room) {
        return { ok: false, message: "Could not find the chatroom." };
    }

    if (room.creator_id !== ownerId) {
        return { ok: false, message: "Only the owner can manage members." };
    }

    if (room.privacy_type !== "private") {
        return {
            ok: false,
            message: "Members can only be managed in private chatrooms."
        };
    }

    if (action === "add") {
        // Keep the existing rule: only friends can be added.
        const { data: friendship, error: friendshipError } =
            await sharedSupabase
                .from("relationships")
                .select("id")
                .eq("status", "friends")
                .or(
                    `and(id_1.eq.${ownerId},id_2.eq.${profile.id}),and(id_1.eq.${profile.id},id_2.eq.${ownerId})`
                )
                .maybeSingle();

        if (friendshipError) {
            return {
                ok: false,
                message: `Could not check whether "${username}" is your friend.`
            };
        }

        if (!friendship) {
            return {
                ok: false,
                message: `"${username}" must be your friend before you can add them.`
            };
        }

        const { data: existing, error: existingError } =
            await sharedSupabase
                .from("chatroom_allowed_users")
                .select("user_id, status")
                .eq("chatroom_id", roomId)
                .eq("user_id", profile.id)
                .maybeSingle();

        if (existingError) {
            return {
                ok: false,
                message: `Could not check "${username}"'s membership.`
            };
        }

        if (existing) {
            if (existing.status === "banned") {
                return {
                    ok: false,
                    message: `"${username}" is banned from this chatroom.`
                };
            }

            if (existing.status === "member" || !existing.status) {
                return {
                    ok: false,
                    message: `"${username}" is already a member.`
                };
            }

            // Reactivate an existing non-member row, if your schema uses statuses.
            const { error: reactivateError } = await sharedSupabase
                .from("chatroom_allowed_users")
                .update({ status: "member" })
                .eq("chatroom_id", roomId)
                .eq("user_id", profile.id);

            if (reactivateError) {
                return { ok: false, message: reactivateError.message };
            }
        } else {
            const { error: insertError } = await sharedSupabase
                .from("chatroom_allowed_users")
                .insert({
                    chatroom_id: roomId,
                    user_id: profile.id,
                    last_read_sequence: 0,
                    status: "member"
                });

            if (insertError) {
                return { ok: false, message: insertError.message };
            }
        }

        return { ok: true, message: `"${username}" added.` };
    }

    if (action === "remove") {
        if (profile.id === room.creator_id) {
            return { ok: false, message: "The owner cannot be removed." };
        }

        const { data: membership, error: membershipError } =
            await sharedSupabase
                .from("chatroom_allowed_users")
                .select("user_id")
                .eq("chatroom_id", roomId)
                .eq("user_id", profile.id)
                .maybeSingle();

        if (membershipError) {
            return {
                ok: false,
                message: `Could not check "${username}"'s membership.`
            };
        }

        if (!membership) {
            return {
                ok: false,
                message: `"${username}" is not a member of this chatroom.`
            };
        }

        const { error: deleteError } = await sharedSupabase
            .from("chatroom_allowed_users")
            .delete()
            .eq("chatroom_id", roomId)
            .eq("user_id", profile.id);

        if (deleteError) {
            return { ok: false, message: deleteError.message };
        }

        return { ok: true, message: `"${username}" removed.` };
    }

    return { ok: false, message: "Unknown member action." };
}


async function toggleInlineChatroomClosed(roomId, currentlyClosed) {
    const { data: { session } } = await sharedSupabase.auth.getSession();

    if (!session) {
        alert("Please log in first.");
        return;
    }

    const { data: room, error: roomError } = await sharedSupabase
        .from("chatrooms")
        .select("id, creator_id, privacy_type")
        .eq("id", roomId)
        .single();

    if (roomError || !room) {
        alert("Could not find this chatroom.");
        return;
    }

    if (room.creator_id !== session.user.id) {
        alert("Only the owner can close or reopen this chatroom.");
        return;
    }

    const action = currentlyClosed ? "reopen" : "close";

    if (!confirm(`Are you sure you want to ${action} this chatroom?`)) {
        return;
    }

    const { error } = await sharedSupabase
        .from("chatrooms")
        .update({ closed: !currentlyClosed })
        .eq("id", roomId);

    if (error) {
        console.error("Could not update chatroom status:", error);
        alert("Could not update the chatroom: " + error.message);
        return;
    }

    showTab(
        currentlyClosed
            ? (room.privacy_type === "private" ? "private" : "public")
            : "archives"
    );
}

function showTab(tab) {
    const content = document.getElementById("chat-content");

    if (tab === "public") {
        content.innerHTML = "";

        const heading = document.createElement("h1");
        heading.textContent = "Public Chatrooms";

        const roomList = document.createElement("div");
        roomList.id = "public-rooms";
        roomList.textContent = "Loading...";

        content.appendChild(heading);
        content.appendChild(roomList);

        loadPublicRooms();
    }

    else if (tab === "private") {
        content.innerHTML = "";

        const heading = document.createElement("h1");
        heading.textContent = "Private Chatrooms";

        const roomList = document.createElement("div");
        roomList.id = "private-rooms";
        roomList.textContent = "Loading...";

        content.appendChild(heading);
        content.appendChild(roomList);

        loadPrivateRooms();
    }

    else if (tab === "dms") {
        content.innerHTML = "";

        const heading = document.createElement("h1");
        heading.textContent = "Direct Messages";

        const roomList = document.createElement("div");
        roomList.id = "dm-rooms";
        roomList.textContent = "Loading...";

        content.appendChild(heading);
        content.appendChild(roomList);

        loadDMs();
    }
    else if (tab === "archives") {
        content.innerHTML = "";
        
        const heading = document.createElement("h1");
        heading.textContent = "Archived Chatrooms";

        const roomList = document.createElement("div");
        roomList.id = "archived-rooms";
        roomList.textContent = "Loading archives...";

        content.appendChild(heading);
        content.appendChild(roomList);

        loadArchivedRooms();
    }


    else if (tab === "create") {
        content.innerHTML = "";

        const heading = document.createElement("h1");
        heading.textContent = "Make a Chatroom";

        const nameLabel = document.createElement("label");
        nameLabel.textContent = "Chatroom name: ";

        const nameInput = document.createElement("input");
        nameInput.id = "room-name";
        nameInput.type = "text";
        nameInput.maxLength = 50;
        nameInput.placeholder = "My cool chatroom";

        nameLabel.appendChild(nameInput);

        const breakOne = document.createElement("br");
        const breakTwo = document.createElement("br");

        const publicLabel = document.createElement("label");

        const publicRadio = document.createElement("input");
        publicRadio.type = "radio";
        publicRadio.name = "privacy";
        publicRadio.value = "public";
        publicRadio.checked = true;
        publicRadio.onchange = updatePrivacyOptions;

        publicLabel.appendChild(publicRadio);
        publicLabel.appendChild(
            document.createTextNode(" Public")
        );

        const breakThree = document.createElement("br");

        const privateLabel = document.createElement("label");

        const privateRadio = document.createElement("input");
        privateRadio.type = "radio";
        privateRadio.name = "privacy";
        privateRadio.value = "private";
        privateRadio.onchange = updatePrivacyOptions;

        privateLabel.appendChild(privateRadio);
        privateLabel.appendChild(
            document.createTextNode(" Private")
        );

        const privateOptions = document.createElement("div");
        privateOptions.id = "private-options";

        const breakFour = document.createElement("br");

        const createButton = document.createElement("button");
        createButton.textContent = "Create Chatroom";
        createButton.onclick = createChatroom;

        content.appendChild(heading);
        content.appendChild(nameLabel);
        content.appendChild(breakOne);
        content.appendChild(breakTwo);
        content.appendChild(publicLabel);
        content.appendChild(breakThree);
        content.appendChild(privateLabel);
        content.appendChild(privateOptions);
        content.appendChild(breakFour);
        content.appendChild(createButton);
    }
}

function updatePrivacyOptions() {

    const privacy = document.querySelector(
        'input[name="privacy"]:checked'
    ).value;

    const options = document.getElementById("private-options");

    if (!options) return;


    if (privacy === "public") {

        options.innerHTML = `
            <p>
                Anyone can access this chatroom.
            </p>
        `;

    }


    else {

        options.innerHTML = `
            <p>
                Choose which friends can access this chatroom:
            </p>

            <div id="friend-list">
                Loading friends...
            </div>
        `;

        loadFriendsForChatroom();

    }

}

async function loadFriendsForChatroom() {

    const friendList = document.getElementById("friend-list");

    if (!friendList) return;

    const { data: { session } } = await sharedSupabase.auth.getSession();

    if (!session) {
        friendList.innerHTML = "<p>Please log in first.</p>";
        return;
    }

    const myId = session.user.id;

    const { data: relationships, error } = await sharedSupabase
        .from("relationships")
        .select(`
            id,
            id_1,
            id_2,
            status,
            profile1:profiles!relationships_id_1_fkey(username),
            profile2:profiles!relationships_id_2_fkey(username)
        `)
        .eq("status", "friends")
        .or(`id_1.eq.${myId},id_2.eq.${myId}`);

    if (error) {
        console.error("Could not load friends:", error);
        friendList.innerHTML = "<p>Could not load your friends.</p>";
        return;
    }

    if (!relationships || relationships.length === 0) {
        friendList.innerHTML = "<p>You don't have any friends yet!</p>";
        return;
    }

    friendList.innerHTML = "";

    relationships.forEach(friendship => {

        let friendId;
        let friendName;

        if (friendship.id_1 === myId) {
            friendId = friendship.id_2;
            friendName = friendship.profile2?.username;
        } else {
            friendId = friendship.id_1;
            friendName = friendship.profile1?.username;
        }

        if (!friendName) {
            friendName = "Unknown User";
        }

        const label = document.createElement("label");

        label.style.display = "block";
        label.style.margin = "8px 0";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "chatroom-friend";
        checkbox.value = friendId;
        label.appendChild(checkbox);
        label.appendChild(
            document.createTextNode(` ${friendName}`)
);

friendList.appendChild(label);
});
}


function createRoomHeading(room, myId, titleText = room.name, allowEdit = true) {
    const top = document.createElement("div");
    top.className = "room-top";

    const title = document.createElement("h3");
    title.className = "chatroom-name";
    title.textContent = titleText;
    title.tabIndex = 0;
    title.setAttribute("role", "link");
    title.title = "Open chatroom";

    title.onclick = () => openChatroom(room.id);

    title.onkeydown = event => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openChatroom(room.id);
        }
    };

    top.appendChild(title);

    if (allowEdit && room.creator_id === myId) {
        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = () => toggleInlineRoomEditor(room, top.parentElement);
        top.appendChild(editButton);
    }

    return top;
}

async function loadPublicRooms() {
    const roomList = document.getElementById("public-rooms");
    if (!roomList) return;

    const { data: { session } } = await sharedSupabase.auth.getSession();

    if (!session) {
        roomList.textContent = "Please log in first.";
        return;
    }

    const myId = session.user.id;

    const { data: rooms, error } = await sharedSupabase
        .from("chatrooms")
        .select("id, name, creator_id, closed, privacy_type")
        .eq("privacy_type", "public")
        .eq("closed", false)
        .order("name", { ascending: true });

    if (error) {
        console.error("Could not load public chatrooms:", error);
        roomList.textContent = "Could not load public chatrooms.";
        return;
    }

    const { data: bans, error: banError } = await sharedSupabase
        .from("chatroom_allowed_users")
        .select("chatroom_id")
        .eq("user_id", myId)
        .eq("status", "banned");

    if (banError) {
        console.error("Could not check chatroom bans:", banError);
        roomList.textContent = "Could not check your chatroom access.";
        return;
    }

    const bannedRoomIds = new Set(
        (bans || []).map(ban => ban.chatroom_id)
    );

    const visibleRooms = (rooms || []).filter(
        room => !bannedRoomIds.has(room.id)
    );
    roomList.innerHTML = "";

    if (visibleRooms.length === 0) {
        roomList.textContent = "There aren't any public chatrooms available!";
        return;
    }

    
    visibleRooms.forEach(room => {
        const roomDiv = document.createElement("div");
        roomDiv.className = "chatroom-entry";
        roomDiv.appendChild(createRoomHeading(room, myId));
        roomList.appendChild(roomDiv);
    });

}


async function loadPrivateRooms() {

    const roomList = document.getElementById("private-rooms");

    if (!roomList) return;

    const { data: { session } } =
        await sharedSupabase.auth.getSession();

    if (!session) {
        roomList.innerHTML = "<p>Please log in first.</p>";
        return;
    }

    const myId = session.user.id;
    const { data: memberships, error } = await sharedSupabase
    .from("chatroom_allowed_users")
    .select(`
        chatroom_id,
        status,
        chatrooms (
            id,
            name,
            creator_id,
            privacy_type,
            closed
        )
    `)
    .eq("user_id", myId)
    .eq("status", "member");

    if (error) {
        console.error("Could not load private chatrooms:", error);
        roomList.innerHTML =
            "<p>Could not load your private chatrooms.</p>";
        return;
    }
    const privmemberships = (memberships || []).filter(
        membership =>
            membership.chatroom_id.startsWith("chat_") &&
            membership.chatrooms &&
            membership.chatrooms.privacy_type === "private" &&
            membership.chatrooms.closed === false
    );
    if (!privmemberships || privmemberships.length === 0) {
        roomList.innerHTML =
            "<p>You aren't in any private chatrooms yet!</p>";
        return;
    }

    roomList.innerHTML = "";

    privmemberships.forEach(privmembership => {
        const room = privmembership.chatrooms;
        if (!room) return;

        const roomDiv = document.createElement("div");
        roomDiv.className = "chatroom-entry";
        roomDiv.appendChild(createRoomHeading(room, myId));
        if (room.creator_id !== myId) {
            const leaveButton = document.createElement("button");
            leaveButton.textContent = "Leave Chatroom";
            leaveButton.onclick = () => leaveChatroom(room.id);
            roomDiv.appendChild(leaveButton);
        }

        roomList.appendChild(roomDiv);
    });

        }
async function loadDMs() {

    const roomList = document.getElementById("dm-rooms");

    if (!roomList) return;

    const { data: { session } } =
        await sharedSupabase.auth.getSession();

    if (!session) {
        roomList.innerHTML = "<p>Please log in first.</p>";
        return;
    }

async function leaveChatroom(roomId) {
    const { data: { session } } = await sharedSupabase.auth.getSession();

    if (!session) {
        alert("Please log in first!");
        return;
    }

    const { data: room, error: roomError } = await sharedSupabase
        .from("chatrooms")
        .select("id, privacy_type, creator_id")
        .eq("id", roomId)
        .single();

    if (roomError || !room) {
        alert("Could not find this chatroom.");
        return;
    }

    if (room.privacy_type !== "private") {
        alert("You cannot leave a public chatroom.");
        return;
    }

    if (room.creator_id === session.user.id) {
        alert("The owner cannot leave their own chatroom.");
        return;
    }

    if (!confirm("Are you sure you want to leave this chatroom?")) {
        return;
    }

    const { error } = await sharedSupabase
        .from("chatroom_allowed_users")
        .delete()
        .eq("chatroom_id", roomId)
        .eq("user_id", session.user.id)
        .eq("status", "member");

    if (error) {
        console.error("Could not leave chatroom:", error);
        alert("Could not leave the chatroom: " + error.message);
        return;
    }

    alert("You left the chatroom.");
    showTab("private");
}

async function showMemberManagement(room) {
    const content = document.getElementById("chat-content");

    content.innerHTML = `
        <h1>Manage Members</h1>

        <div id="member-room-name"></div>

        <div id="current-members">
            Loading members...
        </div>

        <br>

        <button id="add-member-button">
            Add Member
        </button>

            Back
        </button>
    `;

    const roomName = document.getElementById("member-room-name");
    roomName.textContent = room.name;

    document.getElementById("add-member-button").onclick = () => {
        addChatroomMember(room.id);
    };

    document.getElementById("back-members-button").onclick = () => {
        manageChatroom(room.id);
    };

    await loadChatroomMembers(room);

async function loadChatroomMembers(room) {
    const memberList =
        document.getElementById("current-members");

    if (!memberList) return;

    const { data: { session } } =
        await sharedSupabase.auth.getSession();

    if (!session) return;

    const { data: members, error } =
        await sharedSupabase
            .from("chatroom_allowed_users")
            .select("user_id")
            .eq("chatroom_id", room.id);

    if (error) {
        console.error("Could not load members:", error);
        memberList.innerHTML =
            "<p>Could not load members.</p>";
        return;
    }

    if (!members || members.length === 0) {
        memberList.innerHTML =
            "<p>This chatroom has no members.</p>";
        return;
    }

    memberList.innerHTML = "";

    for (const member of members) {

        const { data: profile } =
            await sharedSupabase
                .from("profiles")
                .select("username")
                .eq("id", member.user_id)
                .single();

        const username =
            profile?.username || "Unknown User";

        const memberDiv =
            document.createElement("div");

        memberDiv.style.margin = "10px 0";

        if (member.user_id === room.creator_id) {

            const usernameElement = document.createElement("strong");
            usernameElement.textContent = username;
            const ownerText = document.createElement("span");
            ownerText.textContent = " (Owner)";
            memberDiv.appendChild(usernameElement);
            memberDiv.appendChild(ownerText);

        } else {

            const usernameElement = document.createElement("strong");
            usernameElement.textContent = username;
            const removeButton = document.createElement("button");
            removeButton.textContent = "Remove";
            removeButton.onclick = () => {
                removeChatroomMember(room.id, member.user_id);
            };
            memberDiv.appendChild(usernameElement);
            memberDiv.appendChild(document.createTextNode(" "));
            memberDiv.appendChild(removeButton);
        }

        memberList.appendChild(memberDiv);
    }
}
async function removeChatroomMember(roomId, userId) {
    const { data: { session } } =
        await sharedSupabase.auth.getSession();

    if (!session) {
        alert("Please log in first!");
        return;
    }

    if (!confirm("Remove this member from the chatroom?")) {
        return;
    }

    const { data: room, error: roomError } =
        await sharedSupabase
            .from("chatrooms")
            .select("creator_id")
            .eq("id", roomId)
            .single();

    if (roomError || !room) {
        alert("Could not find chatroom.");
        return;
    }

    if (room.creator_id !== session.user.id) {
        alert("You aren't the owner of this chatroom.");
        return;
    }

    if (userId === room.creator_id) {
        alert("The owner cannot be removed.");
        return;
    }

    const { error } =
        await sharedSupabase
            .from("chatroom_allowed_users")
            .delete()
            .eq("chatroom_id", roomId)
            .eq("user_id", userId);

    if (error) {
        console.error("Could not remove member:", error);
        alert("Could not remove member: " + error.message);
        return;
    }

    await loadChatroomMembers({
        id: roomId,
        creator_id: room.creator_id
    });
}
async function addChatroomMember(roomId) {
    const { data: { session } } =
        await sharedSupabase.auth.getSession();

    if (!session) {
        alert("Please log in first!");
        return;
    }

    const { data: room, error: roomError } =
        await sharedSupabase
            .from("chatrooms")
            .select("id, name, creator_id, privacy_type")
            .eq("id", roomId)
            .single();

    if (roomError || !room) {
        alert("Could not find chatroom.");
        return;
    }

    if (room.creator_id !== session.user.id) {
        alert("You aren't the owner of this chatroom.");
        return;
    }

    const { data: relationships, error } =
        await sharedSupabase
            .from("relationships")
            .select(`
                id_1,
                id_2,
                profile1:profiles!relationships_id_1_fkey(username),
                profile2:profiles!relationships_id_2_fkey(username)
            `)
            .eq("status", "friends")
            .or(
                `id_1.eq.${session.user.id},id_2.eq.${session.user.id}`
            );

    if (error) {
        console.error("Could not load friends:", error);
        alert("Could not load your friends.");
        return;
    }

    const { data: currentMembers } =
        await sharedSupabase
            .from("chatroom_allowed_users")
            .select("user_id")
            .eq("chatroom_id", roomId);

    const memberIds = new Set(
        (currentMembers || []).map(member => member.user_id)
    );

    const availableFriends = (relationships || [])
        .map(friendship => {

            if (friendship.id_1 === session.user.id) {
                return {
                    id: friendship.id_2,
                    username:
                        friendship.profile2?.username ||
                        "Unknown User"
                };
            }

            return {
                id: friendship.id_1,
                username:
                    friendship.profile1?.username ||
                    "Unknown User"
            };
        })
        .filter(friend => !memberIds.has(friend.id));

    if (availableFriends.length === 0) {
        alert("All of your friends are already in this chatroom.");
        return;
    }

    const friendChoices = availableFriends
        .map(friend => `${friend.username} (${friend.id})`)
        .join("\n");

    const chosenId = prompt(
        "Enter the ID of the friend you want to add:\n\n" +
        friendChoices
    );

    if (!chosenId) return;

    const friend = availableFriends.find(
        friend => friend.id === chosenId.trim()
    );

    if (!friend) {
        alert("That friend was not found.");
        return;
    }

    const { error: insertError } =
        await sharedSupabase
            .from("chatroom_allowed_users")
            .insert({
                chatroom_id: roomId,
                user_id: friend.id,
                last_read_sequence: 0
            });

    if (insertError) {
        console.error("Could not add member:", insertError);
        alert("Could not add member: " + insertError.message);
        return;
    }

    alert(`${friend.username} was added to the chatroom.`);

    await showMemberManagement(room);
}

async function toggleChatroomClosed(roomId, currentlyClosed) {

    const { data: { session } } =
        await sharedSupabase.auth.getSession();

    if (!session) {
        alert("Please log in first!");
        return;
    }

    const confirmed = confirm(
        currentlyClosed
            ? "Reopen this chatroom?"
            : "Close this chatroom?"
    );

    if (!confirmed) return;

    const { data: room, error: roomError } =
        await sharedSupabase
            .from("chatrooms")
            .select("id, creator_id, closed")
            .eq("id", roomId)
            .single();

    if (roomError || !room) {
        console.error("Could not find chatroom:", roomError);
        alert("Could not find the chatroom.");
        return;
    }

    if (room.creator_id !== session.user.id) {
        alert("Only the owner can open or close this chatroom.");
        return;
    }

    const { error } = await sharedSupabase
        .from("chatrooms")
        .update({
            closed: !currentlyClosed
        })
        .eq("id", roomId);

    if (error) {
        console.error("Could not update chatroom:", error);
        alert("Could not update the chatroom: " + error.message);
        return;
    }

    await manageChatroom(roomId);
}

async function loadArchivedRooms() {
    const roomList = document.getElementById("archived-rooms");
    if (!roomList) return;

    const { data: { session } } = await sharedSupabase.auth.getSession();

    if (!session) {
        roomList.textContent = "Please log in first.";
        return;
    }

    const myId = session.user.id;

    const { data: bans, error: banError } = await sharedSupabase
        .from("chatroom_allowed_users")
        .select("chatroom_id")
        .eq("user_id", myId)
        .eq("status", "banned");

    if (banError) {
        console.error("Could not check archived-room bans:", banError);
        roomList.textContent = "Could not check your archive access.";
        return;
    }

    const bannedRoomIds = new Set(
        (bans || []).map(ban => ban.chatroom_id)
    );
    const { data: publicRooms, error: publicError } = await sharedSupabase
        .from("chatrooms")
        .select("id, name, creator_id, privacy_type, closed")
        .eq("privacy_type", "public")
        .eq("closed", true)
        .order("name");

    if (publicError) {
        console.error("Could not load public archives:", publicError);
        roomList.textContent = "Could not load archives.";
        return;
    }

    const { data: privateRooms, error: privateError } = await sharedSupabase
        .from("chatrooms")
        .select("id, name, creator_id, privacy_type, closed")
        .eq("privacy_type", "private")
        .eq("closed", true)
        .eq("creator_id", myId)
        .order("name");

    if (privateError) {
        console.error("Could not load private archives:", privateError);
        roomList.textContent = "Could not load archives.";
        return;
    }

    const visiblePublicRooms = (publicRooms || []).filter(
        room => !bannedRoomIds.has(room.id)
    );

    const rooms = [
        ...visiblePublicRooms,
        ...(privateRooms || [])
    ];

    roomList.innerHTML = "";

    if (rooms.length === 0) {
        roomList.textContent = "There are no archived chatrooms.";
        return;
    }

    rooms.forEach(room => {
        const roomDiv = document.createElement("div");
        roomDiv.className = "chatroom-entry";

        const title = document.createElement("h3");
        title.textContent = room.name + " (Closed)";
        roomDiv.appendChild(title);
        if (room.creator_id === myId) {
            const reopenButton = document.createElement("button");
            reopenButton.textContent = "Reopen Chatroom";
            reopenButton.onclick = () => toggleChatroomClosed(room.id, true);
            roomDiv.appendChild(reopenButton);

            const manageButton = document.createElement("button");
            manageButton.textContent = "Manage Chatroom";
            manageButton.onclick = () => manageChatroom(room.id);
            roomDiv.appendChild(manageButton);
        } else {
            const viewButton = document.createElement("button");
            viewButton.textContent = "View Chatroom";
            viewButton.onclick = () => openChatroom(room.id);
            roomDiv.appendChild(viewButton);
        }

        roomList.appendChild(roomDiv);
    });
}

async function createChatroom() {

    const { data: { session } } =
        await sharedSupabase.auth.getSession();

    if (!session) {
        alert("Please log in first!");
        return;
    }

    const myId = session.user.id;

    const nameInput =
        document.getElementById("room-name");

    const roomName =
        nameInput.value.trim();

    if (!roomName) {
        alert("Please give your chatroom a name!");
        return;
    }

    const privacy =
        document.querySelector(
            'input[name="privacy"]:checked'
        ).value;

    const roomId =
        "chat_" + crypto.randomUUID();

    const { error: roomError } =
        await sharedSupabase
            .from("chatrooms")
            .insert({
                id: roomId,
                name: roomName,
                privacy_type: privacy,
                creator_id: myId
            });

    if (roomError) {
        console.error("Chatroom creation error:", roomError);
        alert(
            "Could not create chatroom: " +
            roomError.message
        );
        return;
    }

    if (privacy === "private") {

        const selectedFriends =
            Array.from(
                document.querySelectorAll(
                    ".chatroom-friend:checked"
                )
            ).map(
                checkbox => checkbox.value
            );

        const members = [
            myId,
            ...selectedFriends
        ];

        const uniqueMembers =
            [...new Set(members)];

        const membershipRows =
            uniqueMembers.map(userId => ({
                chatroom_id: roomId,
                user_id: userId,
                last_read_sequence: 0
            }));

        const { error: membershipError } =
            await sharedSupabase
                .from("chatroom_allowed_users")
                .insert(membershipRows);

        if (membershipError) {

            console.error(
                "Membership creation error:",
                membershipError
            );

            await sharedSupabase
                .from("chatrooms")
                .delete()
                .eq("id", roomId);

            alert(
                "Could not add the chatroom members: " +
                membershipError.message
            );

            return;
        }
    }

    window.location.href =
        `messages.html?room=${encodeURIComponent(roomId)}`;
}
