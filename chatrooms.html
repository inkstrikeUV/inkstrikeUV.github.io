<html>
<head>
  <title>Chatrooms</title>
  <link rel="stylesheet" href="chatroomstyle.css">
  <link rel="icon" type="image/x-icon" href="icon.ico">

</head>

<body>
<center>
<div class="chat-layout">

    <aside class="chat-sidebar">
        <h2>Chatrooms</h2>

        <button onclick="showTab('public')">
            Public
        </button>

        <button onclick="showTab('private')">
            Private
        </button>

        <button onclick="showTab('dms')">
            DMs
        </button>

        <hr>

        <button onclick="showTab('create')">
            Make Chatroom
        </button>
    </aside>


    <main id="chat-content">
    </main>

</div>
</center>
<script>
const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showTab(tab) {

    const content = document.getElementById("chat-content");

    if (tab === "public") {

        content.innerHTML = `
            <h1>Public Chatrooms</h1>

            <div id="public-rooms">
                Loading...
            </div>
        `;

        loadPublicRooms();

    }


    else if (tab === "private") {

        content.innerHTML = `
            <h1>Private Chatrooms</h1>

            <div id="private-rooms">
                Loading...
            </div>
        `;

        loadPrivateRooms();

    }


    else if (tab === "dms") {

        content.innerHTML = `
            <h1>Direct Messages</h1>

            <div id="dm-rooms">
                Loading...
            </div>
        `;

        loadDMs();

    }


    else if (tab === "create") {

        content.innerHTML = `
            <h1>Make a Chatroom</h1>

            <label>
                Chatroom name:
                <input
                    id="room-name"
                    type="text"
                    maxlength="50"
                    placeholder="My cool chatroom"
                >
            </label>

            <br><br>

            <label>
                <input
                    type="radio"
                    name="privacy"
                    value="public"
                    checked
                    onchange="updatePrivacyOptions()"
                >
                Public
            </label>

            <br>

            <label>
                <input
                    type="radio"
                    name="privacy"
                    value="private"
                    onchange="updatePrivacyOptions()"
                >
                Private
            </label>

            <div id="private-options"></div>

            <br>

            <button onclick="createChatroom()">
                Create Chatroom
            </button>
        `;

    }

}

function updatePrivacyOptions() {

    const privacy = document.querySelector(
        'input[name="privacy"]:checked'
    ).value;

    const options = document.getElementById("private-options");

    if (!options) return;


    if (privacy === "public") {

        options.innerHTML = `
            <p>
                Anyone can access this chatroom.
            </p>
        `;

    }


    else {

        options.innerHTML = `
            <p>
                Choose which friends can access this chatroom:
            </p>

            <div id="friend-list">
                Loading friends...
            </div>
        `;

        loadFriendsForChatroom();

    }

}

async function loadFriendsForChatroom() {

    const friendList = document.getElementById("friend-list");

    if (!friendList) return;

    const { data: { session } } = await supabaser.auth.getSession();

    if (!session) {
        friendList.innerHTML = "<p>Please log in first.</p>";
        return;
    }

    const myId = session.user.id;

    const { data: relationships, error } = await supabaser
        .from("relationships")
        .select(`
            id,
            id_1,
            id_2,
            status,
            profile1:profiles!relationships_id_1_fkey(username),
            profile2:profiles!relationships_id_2_fkey(username)
        `)
        .eq("status", "friends")
        .or(`id_1.eq.${myId},id_2.eq.${myId}`);

    if (error) {
        console.error("Could not load friends:", error);
        friendList.innerHTML = "<p>Could not load your friends.</p>";
        return;
    }

    if (!relationships || relationships.length === 0) {
        friendList.innerHTML = "<p>You don't have any friends yet!</p>";
        return;
    }

    friendList.innerHTML = "";

    relationships.forEach(friendship => {

        let friendId;
        let friendName;

        if (friendship.id_1 === myId) {
            friendId = friendship.id_2;
            friendName = friendship.profile2?.username;
        } else {
            friendId = friendship.id_1;
            friendName = friendship.profile1?.username;
        }

        if (!friendName) {
            friendName = "Unknown User";
        }

        const label = document.createElement("label");

        label.style.display = "block";
        label.style.margin = "8px 0";

        label.innerHTML = `
            <input
                type="checkbox"
                class="chatroom-friend"
                value="${friendId}"
            >
            ${friendName}
        `;

        friendList.appendChild(label);
    });
}
async function loadPublicRooms() {

    const roomList = document.getElementById("public-rooms");

    if (!roomList) return;

    const { data: rooms, error } = await supabaser
        .from("chatrooms")
        .select("id, name, creator_id")
        .eq("privacy_type", "public")
        .order("name", { ascending: true });

    if (error) {
        console.error("Could not load public chatrooms:", error);
        roomList.innerHTML = "<p>Could not load public chatrooms.</p>";
        return;
    }

    if (!rooms || rooms.length === 0) {
        roomList.innerHTML = "<p>There aren't any public chatrooms yet!</p>";
        return;
    }

    roomList.innerHTML = "";

    rooms.forEach(room => {

        const roomDiv = document.createElement("div");

        roomDiv.className = "chatroom-entry";

        roomDiv.innerHTML = `
            <h3>${room.name}</h3>

            <button onclick="openChatroom('${room.id}')">
                Enter Chatroom
            </button>
        `;

        roomList.appendChild(roomDiv);
    });
}


async function loadPrivateRooms() {

    const roomList = document.getElementById("private-rooms");

    if (!roomList) return;

    const { data: { session } } =
        await supabaser.auth.getSession();

    if (!session) {
        roomList.innerHTML = "<p>Please log in first.</p>";
        return;
    }

    const myId = session.user.id;

    const { data: memberships, error } =
        await supabaser
            .from("chatroom_allowed_users")
            .select(`
                chatroom_id,
                chatrooms (
                    id,
                    name,
                    creator_id
                )
            `)
            .eq("user_id", myId);

    if (error) {
        console.error("Could not load private chatrooms:", error);
        roomList.innerHTML =
            "<p>Could not load your private chatrooms.</p>";
        return;
    }
    const privmemberships = (memberships || []).filter(
    membership => membership.chatroom_id.startsWith("chat_"));
    if (!privmemberships || privmemberships.length === 0) {
        roomList.innerHTML =
            "<p>You aren't in any private chatrooms yet!</p>";
        return;
    }

    roomList.innerHTML = "";

    privmemberships.forEach(privmembership => {

        const room = privmembership.chatrooms;

        if (!room) return;

        const roomDiv = document.createElement("div");

        roomDiv.className = "chatroom-entry";

        roomDiv.innerHTML = `
            <h3>${room.name}</h3>

            <button onclick="openChatroom('${room.id}')">
                Enter Chatroom
            </button>
        `;

        roomList.appendChild(roomDiv);
    });
}

function openChatroom(roomId) {

    window.location.href =
        `messages.html?room=${encodeURIComponent(roomId)}`;

}
async function createChatroom() {

    const { data: { session } } =
        await supabaser.auth.getSession();

    if (!session) {
        alert("Please log in first!");
        return;
    }

    const myId = session.user.id;

    const nameInput =
        document.getElementById("room-name");

    const roomName =
        nameInput.value.trim();

    if (!roomName) {
        alert("Please give your chatroom a name!");
        return;
    }

    const privacy =
        document.querySelector(
            'input[name="privacy"]:checked'
        ).value;

    const roomId =
        "chat_" + crypto.randomUUID();

    const { error: roomError } =
        await supabaser
            .from("chatrooms")
            .insert({
                id: roomId,
                name: roomName,
                privacy_type: privacy,
                creator_id: myId
            });

    if (roomError) {
        console.error("Chatroom creation error:", roomError);
        alert(
            "Could not create chatroom: " +
            roomError.message
        );
        return;
    }

    if (privacy === "private") {

        const selectedFriends =
            Array.from(
                document.querySelectorAll(
                    ".chatroom-friend:checked"
                )
            ).map(
                checkbox => checkbox.value
            );

        const members = [
            myId,
            ...selectedFriends
        ];

        const uniqueMembers =
            [...new Set(members)];

        const membershipRows =
            uniqueMembers.map(userId => ({
                chatroom_id: roomId,
                user_id: userId,
                last_read_sequence: 0
            }));

        const { error: membershipError } =
            await supabaser
                .from("chatroom_allowed_users")
                .insert(membershipRows);

        if (membershipError) {

            console.error(
                "Membership creation error:",
                membershipError
            );

            await supabaser
                .from("chatrooms")
                .delete()
                .eq("id", roomId);

            alert(
                "Could not add the chatroom members: " +
                membershipError.message
            );

            return;
        }
    }

    window.location.href =
        `messages.html?room=${encodeURIComponent(roomId)}`;
}
</script>
</body>
</html>
