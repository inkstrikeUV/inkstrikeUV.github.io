<html>
<h1>
    <center><big>Sign Up</big></center>
</h1>
    <center>
<form id='signupForm'>
    Username:<input type="text" id='username' required><br><br>
    Password:<input type="password" id='password' required><br><br>
    Confirm password:<input type="password" id='confirmPassword' required><br><br>
    <button type="submit">Submit</button>
</form>

    <script>
        const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
        alert("They are not alike.");
        return;
    }

    if (username.includes('@')) {
        alert("Can't use tha @ symbol, bro!");
        return; 
    }
    const fakeEmail = `${username.toLowerCase()}@internal.site`;

    const { data, error } = await supabase.auth.signUp({
        email: fakeEmail,
        password: password,
        options: {
            data: { username: username } 
        }
    });

    if (error) {
        alert("Sign up failed: " + error.message);
    } else {
        await supabase.from('profiles').insert([{ id: data.user.id, username: username }]);
        
        alert("Account created successfully!");
        
        window.location.href = "index.html"; 
    }
}); 


    </script>
</form><br>
