<link rel="stylesheet" href="loginstyle.css">
<head>
  <title>Sign up</title>
  <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>



<html>
<h1>
    <center><big>Sign Up</big></center>
</h1>
    <center>

    <div id="alreadySignedInMessage" style="display: none;">
    <p>You are already signed in!</p>
    <button id="logoutBtn">Sign out to create a new account</button>
    </div>
    <div id="signupFormContainer">
<form id='signupForm'>
    Username:<input type="text" id='username' required><br><br>
    Password:<input type="password" id='password' required><br><br>
    Confirm password:<input type="password" id='confirmPassword' required><br><br>
    <button type="submit">Submit</button>
</form></div>

    <script>
        const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
        supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        
        async function checkExistingSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            document.getElementById('signupFormContainer').style.display = 'none';
            document.getElementById('alreadySignedInMessage').style.display = 'block';
        }
    }
    checkExistingSession();
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        alert("Logged out successfully.");
        window.location.reload(); 
    });


        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
        alert("They are not alike.");
        return;
    }

    if (username.includes('@')) {
        alert("Can't use tha @ symbol, bro!");
        return; 
    }
    const fakeEmail = `${username.toLowerCase()}@internal.site`;

    const { data, error } = await supabase.auth.signUp({
        email: fakeEmail,
        password: password,
        options: {
            data: { username: username } 
        }
    });

    if (error) {
        alert("Sign up failed: " + error.message);
    } else {
        await supabase.from('profiles').insert([{ id: data.user.id, username: username }]);
        
        alert("Account created successfully!");
        
        window.location.href = "index.html"; 
    }
}); 


    </script>
<br>
<br>
</center>
