<html>
<head>
  <title>Messages</title>
  <link rel="stylesheet" href="messagestyle.css">
  <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <div class="header-left">
    <div id="loginlink">
      <a href="loginpage.html" style="color:#300385">sign in</a>
    </div>
    <div id="accountlink" style="display: none;">
      <a href="profile.html" style="color:#300385"><span id="username-display">Loading...</span></a>
    </div>
    <div class="money-container">
      Money:<span id="money-display">Loading...</span>
    </div>
  </div>

  <div class="header-center">
    <img src="ezgif-6dbe54e04356ef45.gif" height="50">
  </div>

  <div class="header-right">

    <div class="notification-wrapper">
      <a href="index.html"><img src="hoamcolonthree.png" height="50" width="50" alt="Hoam :3"></a>
      <a href="notifications.html">
        <img id="notifbell" src="bell.png" height="50" width="50" alt="Notifications">
      </a>
    </div>
  </div>
</header>

<main style="padding: 20px;">
<div class="chatroom-header">
  <h2>Chatroom</h2>

  <button id="notification-toggle" type="button">
    Enable notifications
  </button>
</div>

<div id="chat-box">Loading conversation...</div>
  
  <form id="message-form">
    <input type="text" id="message-input" placeholder="Type your message here..." required style="width: 75%; padding: 8px;">
    <button type="submit" style="padding: 8px 15px; background-color: #300385; color: white; border: none; cursor: pointer;">Send</button>
  </form>
</main>

<script>
const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let money = 0;

var link = document.querySelector("link[rel~='icon']");
if (!link) {
    link = document.createElement('link');
    link.rel = 'icon';
    document.head.appendChild(link);
}
async function initPage() {
    const { data: { session } } = await db.auth.getSession();
    
    if (session) {
        document.getElementById('loginlink').style.display = 'none';
        document.getElementById('accountlink').style.display = 'block';
        const { data, error } = await db
            .from('profiles')
            .select('money, username')
            .eq('id', session.user.id)
            .single();
        if (data) {
            money = data.money;
            document.getElementById("money-display").innerText = money;
            
            document.getElementById("username-display").innerText = data.username || "User";
        } else if (error) {
            console.error("Database error:", error.message);
            document.getElementById("money-display").innerText = "Error";
          };
            
        } else {
            window.location.href = "loginpage.html";
        }
    }
async function loadNotifications() {
    const { data: { session } } = await db.auth.getSession();
    
    if (!session) {
        window.location.href = "loginpage.html";
        return;
    }

const myId = session.user.id;

    const { data: requests, error: err1 } = await db
        .from('relationships')
        .select('id, id_1, profiles!relationships_id_1_fkey(username)')
        .eq('id_2', myId)
        .eq('status', 'requested');

    const { data: renames, error: err2 } = await db
        .from('relationships')
        .select('id, id_1, id_2, proposed_name, namerequesterid, target:profiles!namerequesterid(username)')
        .eq('display_request', true)
        .or(`id_1.eq.${myId},id_2.eq.${myId}`);


    if (err1 || err2) {
        console.error({ err1, err2 });
        return;
    }

    const incomingRenames = renames.filter(r => r.namerequesterid !== myId); 

const { data: memberships, error: membershipError } =
        await db
            .from('chatroom_allowed_users')
            .select(`
                chatroom_id,
                last_read_sequence,
                chatrooms!inner (
                    id,
                    privacy_type
                )
            `)
            .eq('user_id', myId)
            .eq('chatrooms.privacy_type', 'private');


    if (membershipError) {
    console.error("Could not load DM memberships:", membershipError);
}

let hasUnreadDMs = false;

const dmMemberships = (memberships || []).filter(
    membership => membership.chatroom_id.startsWith("dm_")
);

for (const membership of dmMemberships) {

    if (!document.hidden && membership.chatroom_id === roomId) {
        continue;
    }

    const lastRead = membership.last_read_sequence || 0;

    const { data: unreadMessages, error: messageError } =
        await db
            .from('messages')
            .select('id')
            .eq('chatroom_id', membership.chatroom_id)
            .gt('sequence_number', lastRead)
            .neq('sender_id', myId)
            .order('sequence_number', { ascending: true });

    if (messageError) {
        console.error(
            "Could not load unread messages:",
            messageError
        );
        continue;
    }

    if (unreadMessages && unreadMessages.length > 0) {
        hasUnreadDMs = true;
    }
}
    const hasUnreadChatroomNotifications =
    await checkChatroomNotifications();
    if (requests.length === 0 && incomingRenames.length === 0 && !hasUnreadDMs && !hasUnreadChatroomNotifications) {
    document.getElementById("notifbell").src = "bell.png";
    link.href = "icon.ico";
    } else {
    document.getElementById("notifbell").src = "notif.png";
    link.href = "notificon.ico";

    const audio = new Audio("notifsnd.mp3");
    audio.play().catch(error => {
        console.error("Playback failed:", error);
    });
  }};
document.addEventListener("DOMContentLoaded", function() {
    initPage();
});
let lastScrollY = window.scrollY;
const customHeader = document.querySelector('header');

window.addEventListener('scroll', () => {
    if (window.scrollY > lastScrollY && window.scrollY > 50) {
        customHeader.classList.add('hidden');
    } else {
        customHeader.classList.remove('hidden');
    }
    lastScrollY = window.scrollY;
});


function listenForNotificationMessages() {
    db
        .channel('notification-messages')
        .on(
            'postgres_changes',
            {
                event: 'INSERT',
                schema: 'public',
                table: 'messages'
            },
            async (payload) => {
                const message = payload.new;
                if (message.sender_id === currentUserId) {
                    return;
                }
                if (
                    !document.hidden &&
                    message.chatroom_id === roomId
                ) {
                    return;
                }
                document.getElementById("notifbell").src = "notif.png";
                link.href = "notificon.ico";

                const audio = new Audio("notifsnd.mp3");
                audio.play().catch(error => {
                    console.error("Playback failed:", error);
                });
            }
        )
        .subscribe();
}

const MOD_UID = "0996c7e8-6e8b-4725-920b-1f1c162259b0";

const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('room');


if (!roomId) {
  alert("No chatroom specified.");
  window.location.href = "index.html";
}

let currentUserId = null;
const chatBox = document.getElementById('chat-box');
const messageForm = document.getElementById('message-form');
const messageInput = document.getElementById('message-input');
const notificationToggle = document.getElementById('notification-toggle');

if (roomId && roomId.startsWith('dm_')) {
    notificationToggle.style.display = 'none';
}

async function loadNotificationStatus() {
  if (!currentUserId || !roomId) return;

  const { data, error } = await db
    .from('chatroom_notifications')
    .select('enabled')
    .eq('chatroom_id', roomId)
    .eq('user_id', currentUserId)
    .maybeSingle();

  if (error) {
    console.error('Could not load notification status:', error);
    return;
  }

  if (data?.enabled) {
    notificationToggle.textContent = 'Disable notifications';
  } else {
    notificationToggle.textContent = 'Enable notifications';
  }
}
async function toggleNotifications() {
  if (!currentUserId || !roomId) return;

  const { data: existing, error: lookupError } = await db
    .from('chatroom_notifications')
    .select('enabled')
    .eq('chatroom_id', roomId)
    .eq('user_id', currentUserId)
    .maybeSingle();

  if (lookupError) {
    console.error('Could not check notification status:', lookupError);
    return;
  }

  if (existing) {
    const newStatus = !existing.enabled;

    const { error } = await db
      .from('chatroom_notifications')
      .update({
        enabled: newStatus,
        updated_at: new Date().toISOString()
      })
      .eq('chatroom_id', roomId)
      .eq('user_id', currentUserId);

    if (error) {
      console.error('Could not update notifications:', error);
      alert('Could not update notification settings.');
      return;
    }

    notificationToggle.textContent =
      newStatus
        ? 'Disable notifications'
        : 'Enable notifications';

  } else {
    const { error } = await db
      .from('chatroom_notifications')
      .insert({
        chatroom_id: roomId,
        user_id: currentUserId,
        last_read_sequence: 0,
        up_to_date: true,
        enabled: true
      });

    if (error) {
      console.error('Could not enable notifications:', error);
      alert('Could not enable notifications.');
      return;
    }

    notificationToggle.textContent = 'Disable notifications';
  }
}

async function checkChatroomNotifications() {
    if (!currentUserId) return false;

    const { data, error } = await db
        .from('chatroom_notifications')
        .select('chatroom_id')
        .eq('user_id', currentUserId)
        .eq('enabled', true)
        .eq('up_to_date', false);

    if (error) {
        console.error(
            "Could not check chatroom notifications:",
            error
        );
        return false;
    }

    return (data || []).some(
        notification => notification.chatroom_id !== roomId
    );
}

notificationToggle.addEventListener('click', toggleNotifications);

const profileCache = {};

async function getUserProfile(userId) {
  if (profileCache[userId]) return profileCache[userId];

  const { data, error } = await db
    .from('profiles')
    .select('username, avatar_url, bgcolor')
    .eq('id', userId)
    .single();

  if (error || !data) {
    return { username: "Unknown User", avatar_url: "default-pfp.png", bgcolor: "#8f54ff" };
  }

  profileCache[userId] = data;
  return data;
}

async function appendMessage(msg, targetBox = chatBox, scroll = true) {
    const senderProfile = await getUserProfile(msg.sender_id);

    const pfpSrc = senderProfile.avatar_url || 'default-pfp.png';
    const userColor = senderProfile.bgcolor || '#8f54ff';

    const { data: blockRelationship, error: blockError } =
        await db
            .from('relationships')
            .select('id')
            .eq('id_1', currentUserId)
            .eq('id_2', msg.sender_id)
            .eq('status', 'blocked')
            .maybeSingle();

    if (blockError) {
        console.error("Could not check blocked user:", blockError);
    }

    const div = document.createElement('div');
    div.className = 'message';
    div.dataset.messageId = msg.id;
    div.style.setProperty('--user-color', userColor);

    const profileLink = document.createElement('a');
    profileLink.href =
        `profile.html?user=${encodeURIComponent(senderProfile.username)}`;

    const pfp = document.createElement('img');
    pfp.className = 'chat-pfp';
    pfp.src = pfpSrc;
    pfp.alt = `${senderProfile.username}'s pfp`;

    profileLink.appendChild(pfp);

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `${senderProfile.username}:`;

    const content = document.createElement('span');
    content.className = 'msg-content';

    if (blockRelationship) {

        const blockedText = document.createElement('span');
        blockedText.textContent =
            'You have blocked this user, ';

        const showButton = document.createElement('button');
        showButton.textContent = 'show anyway?';

        showButton.addEventListener('click', () => {
            content.textContent = msg.content;
        });

        content.appendChild(blockedText);
        content.appendChild(showButton);

    } else {

        content.textContent = msg.content;

    }

    const timestamp = document.createElement('span');
    timestamp.className = 'message-time';

    const sentAt = new Date(msg.created_at);

    timestamp.textContent = sentAt.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
    });

    div.appendChild(profileLink);
    div.appendChild(meta);
    div.appendChild(content);
    div.appendChild(timestamp);

    if (currentUserId === MOD_UID) {

        const deleteButton = document.createElement('button');

        deleteButton.textContent = 'Delete';
        deleteButton.style.backgroundColor = '#ff0000';

        deleteButton.addEventListener('click', () => {
            deleteMessage(msg.id);
        });

        div.appendChild(deleteButton);
    }

    targetBox.appendChild(div);
    if (scroll) {
      targetBox.scrollTop = targetBox.scrollHeight;
    }
}

async function initializeChatroom() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    alert("Please sign in first!");
    window.location.href = "loginpage.html";
    return;
  }
  currentUserId = user.id;
  await loadNotificationStatus();
  const myProfile = await getUserProfile(user.id);
  document.getElementById('loginlink').style.display = 'none';
  document.getElementById('accountlink').style.display = 'block';
  document.getElementById('username-display').innerText = myProfile.username;


  const { data: room, error } = await db
    .from('chatrooms')
    .select('*')
    .eq('id', roomId)
    .single();

    if (room.closed) {
      messageInput.disabled = true;
      messageForm.querySelector('button[type="submit"]').disabled = true;
  
      const notice = document.createElement('p');
      notice.textContent = 'This chatroom has been closed.';
      notice.className = 'closed-chatroom-notice';
     messageForm.before(notice);
    }

  if (error || !room) {
      alert("Access Denied: You do not have permission to view this chatroom.");
      window.location.href = "index.html"; 
      return;
  }
  const heading = document.querySelector('h2');

if (heading) {
    if (roomId.startsWith('dm_')) {

        const { data: members } = await db
            .from('chatroom_allowed_users')
            .select('user_id')
            .eq('chatroom_id', roomId);

        const otherMember = members?.find(
            member => member.user_id !== currentUserId
        );

        if (otherMember) {
            const otherProfile =
                await getUserProfile(otherMember.user_id);

            heading.textContent = otherProfile.username;
        } else {
            heading.textContent = "Direct Message";
        }

    } else {
        heading.textContent = room.name;
    }
}

  chatBox.innerHTML = ''; 
  await loadMessages();
  await loadNotifications();
  listenForNewMessages();
}

async function loadMessages() {
    const { data: { user } } = await db.auth.getUser();

    if (!user) return;

    chatBox.innerHTML = "Loading conversation...";

    const { data: fetchedMessages, error } = await db
        .from('messages')
        .select('*')
        .eq('chatroom_id', roomId)
        .order('sequence_number', { ascending: true });

    if (error) {
        console.error("Could not load messages:", error);
        chatBox.textContent = "Could not load messages.";
        return;
    }

    const temporaryBox = document.createElement('div');

    if (fetchedMessages && fetchedMessages.length > 0) {
        for (const msg of fetchedMessages) {
            await appendMessage(msg, temporaryBox, false);
        }
    }

    chatBox.innerHTML = "";
    chatBox.append(...temporaryBox.children);

    chatBox.scrollTop = chatBox.scrollHeight;

    if (!fetchedMessages || fetchedMessages.length === 0) {
        chatBox.textContent = "No messages yet.";
        return;
    }

    const newestSequence =
        fetchedMessages[fetchedMessages.length - 1].sequence_number;

    const { data: updatedRows, error: readError } = await db
        .from('chatroom_allowed_users')
        .update({
            last_read_sequence: newestSequence
        })
        .eq('chatroom_id', roomId)
        .eq('user_id', user.id)
        .select();

    const { data: notificationRow, error: notificationReadError } = await db
    .from('chatroom_notifications')
    .update({
        last_read_sequence: newestSequence,
        up_to_date: true,
        updated_at: new Date().toISOString()
    })
    .eq('chatroom_id', roomId)
    .eq('user_id', currentUserId)
    .select();

    if (notificationReadError) {
        console.error(
            'Could not mark notifications as read:',
            notificationReadError
        );
    }

    console.log("Updated membership:", updatedRows);
    console.log("Update error:", readError);
    if (readError) {
        console.error(
            "Could not mark messages as read:",
            readError
        );
    }
}

async function sendMessage(text) {
  const { error } = await db
    .from('messages')
    .insert([{ chatroom_id: roomId, content: text }]);

  if (error) {
    alert("Could not send message.");
  } else {
    messageInput.value = '';
  }
}
async function deleteMessage(messageId) {
  if (currentUserId !== MOD_UID) return;

  const { error } = await db
    .from('messages')
    .delete()
    .eq('id', messageId);

  if (error) {
    console.error("Could not delete message:", error);
    alert("Could not delete message.");
  }
}

function listenForNewMessages() {
  db
    .channel(`room-${roomId}`)
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'messages'
      },
      async (payload) => {
        if (payload.new && payload.new.chatroom_id === roomId) {
          await appendMessage(payload.new);
        }
      }
    )
    .on(
      'postgres_changes',
      {
        event: 'DELETE',
        schema: 'public',
        table: 'messages'
      },
      (payload) => {
        const deletedMessage = document.querySelector(
          `[data-message-id="${payload.old.id}"]`
        );

        if (deletedMessage) {
          deletedMessage.remove();
        }
      }
    )
    .subscribe();
}


messageForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (text) {
    messageInput.value = '';
    await sendMessage(text);
  }
});

initializeChatroom().then(() => {
    listenForNotificationMessages();
});
</script>

</body>
</html>
