<html>
<head>
  <title>Violet's cool website</title>
  <link rel="stylesheet" href="messagestyle.css">
  <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <div class="header-left">
    <div id="loginlink">
      <a href="loginpage.html" style="color:#300385">sign in</a>
    </div>
    <div id="accountlink" style="display: none;">
      <a href="profile.html" style="color:#300385"><span id="username-display">Loading...</span></a>
    </div>
    <div class="money-container">
      Money:<span id="money-display">Loading...</span>
    </div>
  </div>

  <div class="header-center">
    <img src="ezgif-6dbe54e04356ef45.gif" height="50">
  </div>

  <div class="header-right">

    <div class="notification-wrapper">
      <a href="index.html"><img src="hoamcolonthree.png" height="50" width="50" alt="Hoam :3"></a>
      <a href="notifications.html">
        <img id="notifbell" src="bell.png" height="50" width="50" alt="Notifications">
      </a>
    </div>
  </div>
</header>

<main style="padding: 20px;">
  <h2>Chatroom</h2>
  <div id="chat-box">Loading conversation...</div>
  
  <form id="message-form">
    <input type="text" id="message-input" placeholder="Type your message here..." required style="width: 75%; padding: 8px;">
    <button type="submit" style="padding: 8px 15px; background-color: #300385; color: white; border: none; cursor: pointer;">Send</button>
  </form>
</main>

<script>
const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let money = 0;
var link = document.querySelector("link[rel~='icon']");
if (!link) {
    link = document.createElement('link');
    link.rel = 'icon';
    document.head.appendChild(link);
}
async function initPage() {
    const { data: { session } } = await supabaser.auth.getSession();
    
    if (session) {
        document.getElementById('loginlink').style.display = 'none';
        document.getElementById('accountlink').style.display = 'block';
        const { data, error } = await supabaser
            .from('profiles')
            .select('money, username')
            .eq('id', session.user.id)
            .single();
        if (data) {
            money = data.money;
            document.getElementById("money-display").innerText = money;
            
            document.getElementById("username-display").innerText = data.username || "User";
        } else if (error) {
            console.error("Database error:", error.message);
            document.getElementById("money-display").innerText = "Error";
          };
            
        } else {
            window.location.href = "loginpage.html";
        }
    }
async function loadNotifications() {
    const { data: { session } } = await supabaser.auth.getSession();
    
    if (!session) {
        window.location.href = "loginpage.html";
        return;
    }

const myId = session.user.id;

    const { data: requests, error: err1 } = await supabaser
        .from('relationships')
        .select('id, id_1, profiles!relationships_id_1_fkey(username)')
        .eq('id_2', myId)
        .eq('status', 'requested');

    const { data: renames, error: err2 } = await supabaser
        .from('relationships')
        .select('id, id_1, id_2, proposed_name, namerequesterid, target:profiles!namerequesterid(username)') // <-- Changed constraint name to column name
        .eq('display_request', true)
        .or(`id_1.eq.${myId},id_2.eq.${myId}`);


    if (err1 || err2) {
        console.error({ err1, err2 });
        return;
    }

    const incomingRenames = renames.filter(r => r.namerequesterid !== myId); 

const { data: memberships, error: membershipError } =
        await supabaser
            .from('chatroom_allowed_users')
            .select(`
                chatroom_id,
                last_read_sequence,
                chatrooms!inner (
                    id,
                    privacy_type
                )
            `)
            .eq('user_id', myId)
            .eq('chatrooms.privacy_type', 'private');


    if (membershipError) {
    console.error("Could not load DM memberships:", membershipError);
}

let hasUnreadDMs = false;

const dmMemberships = (memberships || []).filter(
    membership => membership.chatroom_id.startsWith("dm_")
);

for (const membership of dmMemberships) {
    const lastRead = membership.last_read_sequence || 0;

    const { data: unreadMessages, error: messageError } =
        await supabaser
            .from('messages')
            .select('id, sequence_number, sender_id, content')
            .eq('chatroom_id', membership.chatroom_id)
            .gt('sequence_number', lastRead)
            .neq('sender_id', myId)
            .order('sequence_number', { ascending: true });

    if (messageError) {
        console.error(
            "Could not load unread messages:",
            messageError
        );
        continue;
    }

    if (unreadMessages && unreadMessages.length > 0) {
        hasUnreadDMs = true;
    }
}

    if (requests.length === 0 && incomingRenames.length === 0 && !hasUnreadDMs) {
    document.getElementById("notifbell").src = "bell.png";
    link.href = "icon.ico";
    } else {
    document.getElementById("notifbell").src = "notif.png";
    link.href = "notificon.ico";

    const audio = new Audio("notifsnd.mp3");
    audio.play().catch(error => {
        console.error("Playback failed:", error);
    });
  }};
document.addEventListener("DOMContentLoaded", function() {
    initPage();
    loadNotifications();
});
let lastScrollY = window.scrollY;
const customHeader = document.querySelector('header');

window.addEventListener('scroll', () => {
    if (window.scrollY > lastScrollY && window.scrollY > 50) {
        customHeader.classList.add('hidden');
    } else {
        customHeader.classList.remove('hidden');
    }
    lastScrollY = window.scrollY;
});

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); 
const MOD_UID = "0996c7e8-6e8b-4725-920b-1f1c162259b0";

const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('room');

const chatBox = document.getElementById('chat-box');
const messageForm = document.getElementById('message-form');
const messageInput = document.getElementById('message-input');

const profileCache = {};

async function getUserProfile(userId) {
  if (profileCache[userId]) return profileCache[userId];

  const { data, error } = await db
    .from('profiles')
    .select('username, avatar_url, bgcolor')
    .eq('id', userId)
    .single();

  if (error || !data) {
    return { username: "Unknown User", avatar_url: "default-pfp.png", bgcolor: "#8f54ff" };
  }

  profileCache[userId] = data;
  return data;
}
let currentUserId = null;

async function appendMessage(msg) {
  const senderProfile = await getUserProfile(msg.sender_id);
  const pfpSrc = senderProfile.avatar_url || 'default-pfp.png';
  const userColor = senderProfile.bgcolor || '#8f54ff';

  const div = document.createElement('div');
  div.className = 'message';
  div.dataset.messageId = msg.id;
  div.style.setProperty('--user-color', userColor);

  let deleteButton = "";

  if (currentUserId === MOD_UID) {
    deleteButton = `
      <button style="background-color: #ff0000;" onclick="deleteMessage('${msg.id}')">
        Delete
      </button>`;
  }

  div.innerHTML = `
    <a href="profile.html?user=${senderProfile.username}">
      <img class="chat-pfp" src="${pfpSrc}" alt="${senderProfile.username}'s pfp">
    </a>

    <span class="meta">${senderProfile.username}:</span>
    <span class="msg-content">${msg.content}</span>
    ${deleteButton}`;

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function initializeChatroom() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    alert("Please sign in first!");
    window.location.href = "loginpage.html";
    return;
  }
  currentUserId = user.id;

  const myProfile = await getUserProfile(user.id);
  document.getElementById('loginlink').style.display = 'none';
  document.getElementById('accountlink').style.display = 'block';
  document.getElementById('username-display').innerText = myProfile.username;


  const { data: room, error } = await db
    .from('chatrooms')
    .select('*')
    .eq('id', roomId)
    .single();

  if (error || !room) {
      alert("Access Denied: You do not have permission to view this chatroom.");
      window.location.href = "index.html"; 
      return;
  }
  const heading = document.querySelector('h2');

if (heading) {
    if (roomId.startsWith('dm_')) {

        const { data: members } = await db
            .from('chatroom_allowed_users')
            .select('user_id')
            .eq('chatroom_id', roomId);

        const otherMember = members?.find(
            member => member.user_id !== currentUserId
        );

        if (otherMember) {
            const otherProfile =
                await getUserProfile(otherMember.user_id);

            heading.textContent = otherProfile.username;
        } else {
            heading.textContent = "Direct Message";
        }

    } else {
        heading.textContent = room.name;
    }
}

  chatBox.innerHTML = ''; 
  loadMessages();
  listenForNewMessages();
}

async function loadMessages() {

    const { data: { user } } = await db.auth.getUser();

    if (!user) return;

    const { data: fetchedMessages, error } = await db
        .from('messages')
        .select('*')
        .eq('chatroom_id', roomId)
        .order('sequence_number', { ascending: true });

    if (error) {
        console.error("Could not load messages:", error);
        return;
    }

    chatBox.innerHTML = '';

    if (!fetchedMessages || fetchedMessages.length === 0) {
        return;
    }

    for (const msg of fetchedMessages) {
        await appendMessage(msg);
    }

    const newestSequence =
        fetchedMessages[fetchedMessages.length - 1].sequence_number;

    console.log("Room:", roomId);
    console.log("My user ID:", user.id);
    console.log("Newest sequence:", newestSequence);

    const { data: updatedRows, error: readError } = await db
        .from('chatroom_allowed_users')
        .update({
            last_read_sequence: newestSequence
        })
        .eq('chatroom_id', roomId)
        .eq('user_id', user.id)
        .select();

    console.log("Updated membership:", updatedRows);
    console.log("Update error:", readError);

    if (readError) {
        console.error("Could not mark messages as read:", readError);
    }
}

async function sendMessage(text) {
  const { error } = await db
    .from('messages')
    .insert([{ chatroom_id: roomId, content: text }]);

  if (error) {
    alert("Could not send message.");
  } else {
    messageInput.value = '';
  }
}
async function deleteMessage(messageId) {
  if (currentUserId !== MOD_UID) return;

  const { error } = await db
    .from('messages')
    .delete()
    .eq('id', messageId);

  if (error) {
    console.error("Could not delete message:", error);
    alert("Could not delete message.");
  }
}

function listenForNewMessages() {
  db
    .channel(`room-${roomId}`)
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'messages'
      },
      async (payload) => {
        if (payload.new && payload.new.chatroom_id === roomId) {
          await appendMessage(payload.new);
        }
      }
    )
    .on(
      'postgres_changes',
      {
        event: 'DELETE',
        schema: 'public',
        table: 'messages'
      },
      (payload) => {
        const deletedMessage = document.querySelector(
          `[data-message-id="${payload.old.id}"]`
        );

        if (deletedMessage) {
          deletedMessage.remove();
        }
      }
    )
    .subscribe();
}


messageForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (text) {
    messageInput.value = '';
    await sendMessage(text);
  }
});

initializeChatroom();
</script>

<footer><a href="../index.html" style="color:#300385"><center>hoam :3</center></a></footer>
</body>
</html>
