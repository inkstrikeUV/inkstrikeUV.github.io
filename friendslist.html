<html>
<head>
    <title>Violet's cool website</title>
    <link rel="stylesheet" href="profilesheet.css">
    <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<center>
    <h1 id="list-title">Friends</h1>
    
    <div id="friends-container">Loading friends...</div>
    
    <br><br>
    <a id="back-to-profile" href="#" style="color:#300385">Back to profile</a>
</center>
</body>

<script>
const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadFriendsList() {
    const urlParams = new URLSearchParams(window.location.search);
    const targetUsername = urlParams.get('user');

    if (!targetUsername) {
        document.getElementById("friends-container").innerText = "No user specified.";
        return;
    }

    document.getElementById("list-title").innerText = `${targetUsername}'s Friends`;
    document.getElementById("back-to-profile").href = `profile.html?user=${targetUsername}`;

    // 1. Get Logged in user info
    let loggedInUserId = null;
    const { data: { session } } = await supabaser.auth.getSession();
    if (session) {
        loggedInUserId = session.user.id;
    }

    // 2. Find target user ID
    const { data: targetUser, error: userError } = await supabaser
        .from('profiles')
        .select('id, bgcolor')
        .eq('username', targetUsername)
        .single();
        

    if (userError || !targetUser) {
        document.getElementById("friends-container").innerText = "User not found.";
        return;
    }

    if (targetUser.bgcolor) {
        document.body.style.backgroundColor = targetUser.bgcolor;
    }
    const isOwner = loggedInUserId === targetUser.id;

    const { data: rels, error: relsError } = await supabaser
        .from('relationships')
        .select('id, id_1, id_2, display_name, namerequesterid')
        .eq('status', 'friends')
        .or(`id_1.eq.${targetUser.id},id_2.eq.${targetUser.id}`);

    if (relsError) {
        console.error(relsError);
        document.getElementById("friends-container").innerText = "Error loading relationships.";
        return;
    }

    if (!rels || rels.length === 0) {
        document.getElementById("friends-container").innerText = "No friends found yet! :(";
        return;
    }

    const friendIds = rels.map(r => r.id_1 === targetUser.id ? r.id_2 : r.id_1);

    const { data: friendsProfiles, error: profilesError } = await supabaser
        .from('profiles')
        .select('id, username, avatar_url')
        .in('id', friendIds);

    if (profilesError) {
        console.error(profilesError);
        document.getElementById("friends-container").innerText = "Error loading friend profiles.";
        return;
    }

    const container = document.getElementById("friends-container");
    container.innerHTML = ""; 

    friendsProfiles.forEach(friend => {
        const matchingRel = rels.find(r => r.id_1 === friend.id || r.id_2 === friend.id);
        const displayName = matchingRel ? matchingRel.display_name : null;

        const friendDiv = document.createElement("div");
        friendDiv.style.margin = "15px";
        friendDiv.style.padding = "10px";
        friendDiv.style.border = "1px solid #300385";
        friendDiv.style.borderRadius = "8px";
        friendDiv.style.width = "320px";
        friendDiv.style.display = "flex";
        friendDiv.style.flexDirection = "column";
        friendDiv.style.alignItems = "center";
        friendDiv.style.gap = "10px";

        const detailsDiv = document.createElement("div");
        detailsDiv.style.display = "flex";
        detailsDiv.style.alignItems = "center";
        detailsDiv.style.width = "100%";
        detailsDiv.style.gap = "15px";

        const img = document.createElement("img");
        img.src = friend.avatar_url || "default-pfp.png";
        img.style.width = "40px";
        img.style.height = "40px";
        img.style.borderRadius = "50%";
        img.style.objectFit = "cover";

        const nameSpan = document.createElement("span");
        const formattedLabel = displayName ? `${friend.username} (${displayName})` : friend.username;
        
        const link = document.createElement("a");
        link.href = `profile.html?user=${friend.username}`;
        link.innerText = formattedLabel;
        link.style.fontWeight = "bold";
        link.style.color = "#300385";
        nameSpan.appendChild(link);

        detailsDiv.appendChild(img);
        detailsDiv.appendChild(nameSpan);
        friendDiv.appendChild(detailsDiv);

        if (isOwner && matchingRel) {
            const nicknameForm = document.createElement("div");
            nicknameForm.style.display = "flex";
            nicknameForm.style.gap = "5px";
            nicknameForm.style.width = "100%";

            const input = document.createElement("input");
            input.type = "text";
            input.placeholder = "Set friend nickname...";
            input.value = displayName || "";
            input.style.flex = "1";

            const btn = document.createElement("button");
            btn.innerText = "Save";
            btn.addEventListener('click', async () => {
                const newNickname = input.value.trim();
                
                const { error: updateError } = await supabaser
                .from('relationships')
                .update({ 
                    proposed_name: newNickname || null, 
                    display_request: true,
                    namerequesterid: loggedInUserId
                })
                .eq('id', matchingRel.id);

                if (updateError) {
                    console.error(updateError);
                    alert("Failed to send name request.");
                } else {
                    alert("Name request sent successfully!");
                    location.reload();
                }
            });

            nicknameForm.appendChild(input);
            nicknameForm.appendChild(btn);
            friendDiv.appendChild(nicknameForm);
        }

        container.appendChild(friendDiv);
    });
}

loadFriendsList();
</script>
<footer><a href="../index.html" style="color:#300385"><center>hoam :3</center></a></footer>
</html>
