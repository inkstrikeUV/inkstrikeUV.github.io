<link rel="stylesheet" href="profilesheet.css">
<head>
  <title>Violet's cool website</title>
  <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<html>
    <div id="settingsbutton" style="display: none;"><a href="settings.html">settings</a></div>
<center>
<div id="profile-card">
    <h1 id="viewing-username">Loading profile...</h1>
    <img id="viewing-pfp" src="default-pfp.png" style="width:150px; height:150px; border-radius:50%; object-fit:cover;">
    <p id="viewing-money"></p>
    <p id="viewing-bio"></p>
</div>
<div id="privacymessage"style="display: none;">This user is private</div>
</center>
</body>
<script>
const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadProfile() {

    const urlParams = new URLSearchParams(window.location.search);
    let targetUsername = urlParams.get('user');
    let loggedInUsername = null;

    const { data: { session } } = await supabaser.auth.getSession();
    if (session) {
        const { data: myData } = await supabaser
            .from('profiles')
            .select('username')
            .eq('id', session.user.id)
            .single();
        
        if (myData) {
            loggedInUsername = myData.username;
        }
    }
    if (!targetUsername) {
        targetUsername = loggedInUsername;
    }
    if (loggedInUsername && targetUsername && loggedInUsername === targetUsername) {
        document.getElementById('settingsbutton').style.display = 'block';
    }


    if (!targetUsername) {
        document.getElementById("viewing-username").innerText = "No profile specified. Please log in or view a direct user link.";
        return;
    }

    const { data, error } = await supabaser
        .from('profiles')
        .select('username, bio, money, bgcolor, avatar_url, privacy')
        .eq('username', targetUsername) 
        .single();

    if (error || !data) {
        document.getElementById("viewing-username").innerText = "User profile not found.";
        console.error("Profile fetch error:", error);
        return;
    }
    if (data.privacy === "private" && loggedInUsername !== data.username)
    {
        document.getElementById('privacymessage').style.display = 'block';
        return
    }
    document.getElementById("viewing-username").innerText = `${data.username}`;
    document.getElementById("viewing-money").innerText = `Money: ${data.money}`;
    document.getElementById("viewing-bio").innerText = data.bio || "No bio written yet.";
    if (data.avatar_url) {
        document.getElementById("viewing-pfp").src = data.avatar_url;
    };
    if (data.bgcolor) {
        document.body.style.backgroundColor = data.bgcolor;
    };
};

loadProfile();
</script>


</html>
