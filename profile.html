<html>
<head>
    <title>Violet's cool website</title>
    <link rel="stylesheet" href="profilesheet.css">
    <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<center>
<h1 id="viewing-username">Loading profile...</h1>
<div id="profile-card">
    <img id="viewing-pfp" src="default-pfp.png" style="width:150px; height:150px; border-radius:50%; object-fit:cover;">
</div>
    <div id="friendrequest" style="display: none;"><button>send friend request</button></div>
    <div id="FRIENDSmsg" style="display: none;">FRIENDS!!! YIPPEEE YAYAYAYAY</div>
    <div id="direct-message" style="display: none; margin-top: 15px;">
    <button id="dm-button" style="background-color: #8f54ff; color: #ffffff; padding: 10px 20px; border: 2px solid #300385; border-radius: 8px; font-family: font;">💬 Message User</button>
    </div>
    <div id="blockbutton" style="display: none;"><button>Block</button></div>
    <div id="settingsbutton" style="display: none;"><a href="settings.html">settings</a></div>
<div id="profile-card2">
    <p id="viewing-money"></p>
    <div id="friendslist" style="display: none;"><a id="friends-link" href="#">friends</a></div>
    <p id="viewing-bio"></p>
</div>

<div id="privacymessage"style="display: none;">This user is private</div>
</center>
</body>
<script>
const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function ensureChatroomExists(roomId, myId, targetId) {
    const { data: existingRoom } = await supabaser
        .from('chatrooms')
        .select('id')
        .eq('id', roomId)
        .maybeSingle();
    
    if (!existingRoom) {
        const { error: roomError } = await supabaser.from('chatrooms').insert({ 
            id: roomId, 
            privacy_type: 'private', 
            creator_id: myId 
        });
        
        if (roomError) {
            console.error("Chatroom Insert Error:", roomError);
            alert("Database blocked room creation: " + roomError.message);
            return false;
        }
        const { error: allowedError } = await supabaser.from('chatroom_allowed_users').insert([
            { chatroom_id: roomId, user_id: myId },
            { chatroom_id: roomId, user_id: targetId }
        ]);
        if (allowedError) {
            console.error("Allowed Users Insert Error:", allowedError);
            alert("Database blocked adding users to room: " + allowedError.message);
            return false;
        }
    }
    return true;
}

async function loadProfile() {

    const urlParams = new URLSearchParams(window.location.search);
    let targetUsername = urlParams.get('user');
    let loggedInUsername = null;

    const { data: { session } } = await supabaser.auth.getSession();
    if (session) {
        const { data: myData } = await supabaser
            .from('profiles')
            .select('username')
            .eq('id', session.user.id)
            .single();
        
        if (myData) {
            loggedInUsername = myData.username;
        }
    }
    if (!targetUsername) {
        targetUsername = loggedInUsername;
    }
    if (loggedInUsername && targetUsername && loggedInUsername === targetUsername) {
        document.getElementById('settingsbutton').style.display = 'block';
    }


    if (!targetUsername) {
        document.getElementById("viewing-username").innerText = "No profile specified. Please log in or view a direct user link.";
        return;
    }

    const { data, error } = await supabaser
        .from('profiles')
        .select('username, bio, money, bgcolor, avatar_url, privacy')
        .eq('username', targetUsername) 
        .single();

    if (error || !data) {
        document.getElementById("viewing-username").innerText = "User profile not found.";
        console.error("Profile fetch error:", error);
        return;
    }
    const friendsLink = document.getElementById('friends-link');
    friendsLink.href = `friendslist.html?user=${data.username}`;
    document.getElementById('friendslist').style.display = 'block';
    


    
    let relationship = null;
    if (loggedInUsername && loggedInUsername !== data.username) {
        const { data: me } = await supabaser.from('profiles').select('id').eq('username', loggedInUsername).single();
        const { data: target } = await supabaser.from('profiles').select('id').eq('username', data.username).single();

        if (me && target) {
            const { data: rel } = await supabaser
                .from('relationships')
                .select('*')
                .or(`and(id_1.eq.${me.id},id_2.eq.${target.id}),and(id_1.eq.${target.id},id_2.eq.${me.id})`)
                .maybeSingle();
            
            relationship = rel;
            if (!relationship) {
                document.getElementById('friendrequest').style.display = 'block';
            } else if (relationship.status === 'requested') {
                document.getElementById('friendrequest').innerHTML = '<button disabled>Request Pending...</button>';
                document.getElementById('friendrequest').style.display = 'block';
                } else if (relationship.status === 'friends') {
                document.getElementById('FRIENDSmsg').style.display = 'block';
                if (relationship.display_name) {
                    document.getElementById('FRIENDSmsg').innerText = `${relationship.display_name}!!! YIPPEEE YAYAYAYAY`;
                }
                const ids = [me.id, target.id].sort();
                const oneOnOneRoomId = `dm_${ids[0]}_${ids[1]}`;
                const dmContainer = document.getElementById('direct-message');
                const dmButton = document.getElementById('dm-button');
                dmContainer.style.display = 'block';
                dmButton.onclick = async () => {
                    dmButton.innerText = "Connecting...";
                    dmButton.disabled = true;
                    const success = await ensureChatroomExists(oneOnOneRoomId, me.id, target.id);
                                        if (success) {
                        window.location.href = `messages.html?room=${oneOnOneRoomId}`;
                    } else {
                        dmButton.innerText = "💬 Message User";
                        dmButton.disabled = false;
                    }
                };
            } else if (relationship.status === 'blocked') {
                document.getElementById('profile-card').style.display = 'none';
                document.getElementById('profile-card2').style.display = 'none';
                document.getElementById('viewing-username').innerText = "User unavailable.";
                return;
            }
            document.getElementById('blockbutton').style.display = 'block';

        }
    }
    document.getElementById("viewing-username").innerText = `${data.username}`;
    const isOwner = loggedInUsername === data.username;
    const areFriends = relationship && relationship.status === 'friends';
    if (!isOwner) {
    if (data.privacy === "private") {
        document.getElementById('profile-card').style.display = 'none';
        document.getElementById('profile-card2').style.display = 'none';
        document.getElementById('privacymessage').innerText = "This user is private.";
        document.getElementById('privacymessage').style.display = 'block';
        return;
    }
    if (data.privacy === "friends" && !areFriends) {
        document.getElementById('profile-card').style.display = 'none';
        document.getElementById('profile-card2').style.display = 'none';
        document.getElementById('privacymessage').innerText = "This profile is only visible to friends.";
        document.getElementById('privacymessage').style.display = 'block';
        return;
    }
}

    document.getElementById("viewing-money").innerText = `Money: ${data.money}`;
    document.getElementById("viewing-bio").innerText = data.bio || "No bio written yet.";
    if (data.avatar_url) {
        document.getElementById("viewing-pfp").src = data.avatar_url;
    };
    if (data.bgcolor) {
        document.body.style.backgroundColor = data.bgcolor;
    };
};

loadProfile();

document.querySelector('#friendrequest button').addEventListener('click', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const targetUsername = urlParams.get('user');
    
    const { data: { session } } = await supabaser.auth.getSession();
    if (!session) return alert("You must be logged in to send a friend request!");

    const { data: targetUser } = await supabaser
        .from('profiles')
        .select('id')
        .eq('username', targetUsername)
        .single();

    if (!targetUser) return alert("User not found.");

    const { error } = await supabaser
        .from('relationships')
        .insert({
            id_1: session.user.id,    
            id_2: targetUser.id,
            status: 'requested',
            display_request: false
        });

    if (error) {
        console.error(error);
        alert("Failed to send friend request.");
    } else {
        alert("Friend request sent!");
        location.reload();
    }
});

const blockBtn = document.querySelector('#blockbutton button');
if (blockBtn) {
    blockBtn.addEventListener('click', async () => {
        if (!confirm("Are you sure you want to block this user?")) return;

        const urlParams = new URLSearchParams(window.location.search);
        const targetUsername = urlParams.get('user');

        const { data: { session } } = await supabaser.auth.getSession();
        if (!session) return alert("You must be logged in to block a user!");

        const { data: targetUser } = await supabaser
            .from('profiles')
            .select('id')
            .eq('username', targetUsername)
            .single();

        if (!targetUser) return alert("User not found.");

        const { error } = await supabaser
            .from('relationships')
            .upsert({
                id_1: session.user.id,
                id_2: targetUser.id,
                status: 'blocked'
            }, { onConflict: 'id_1,id_2' });

        if (error) {
            console.error(error);
            alert("Failed to block user.");
        } else {
            alert("User blocked successfully.");
            location.reload();
        }
    });
}

</script>



<footer><a href="../index.html" style="color:#300385"><center>hoam :3</center></a></footer>
</html>
