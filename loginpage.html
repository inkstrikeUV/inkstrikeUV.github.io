<head>
  <title>Log in</title>
  <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<html>
<h1>
    <center><big>Log in</big></center>
</h1>
<center>
      <div id="alreadySignedInMessage" style="display: none;">
    <p>You are already signed in!</p>
    <button id="logoutBtn">Sign out?</button>
    </div>
    <div id="loginFormContainer">
    <form id='loginForm'>
    Username or email:<input type="text" id='username' required><br><br>
    Password:<input type="password" id='password' required><br><br>
    <button type="submit">Submit</button><br><br></form>
    <button id="loginwithemailbutton">Sign in via email?</button></div><br><br></center>
    <script>
        const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
        const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkExistingSession() {
        const { data: { session } } = await supabaser.auth.getSession();
        if (session) {
            document.getElementById('loginFormContainer').style.display = 'none';
            document.getElementById('alreadySignedInMessage').style.display = 'block';
        }
    }
    checkExistingSession();
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaser.auth.signOut();
        alert("Logged out successfully.");
        window.location.reload(); 
    });
      
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
        const identifier = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        let targetEmail = identifier;

        if (!identifier.includes('@')) {
        targetEmail = `${identifier.toLowerCase()}@internal.site`;
        }
        const { data, error } = await supabaser.auth.signInWithPassword({
            email: targetEmail,
            password: password
        });
        if (error) {
            alert("Login failed: " + error.message);
        } else {
            alert("YAYAYAYAY YIPPEE UR LOGGED INNN");
            window.location.href = "index.html";
            }
        });

        document.getElementById('loginwithemailbutton').addEventListener('click', async () => {
            const identifier = document.getElementById('username').value.trim();

            if (!identifier || !identifier.includes('@')) {
                alert("Thats not a valid email silly!!");
                return; 
            }
            const { error } = await supabaser.auth.signInWithOtp({
                email: identifier,
                options: {
                    emailRedirectTo: window.location.href
                }
            });
            if (error) {
                alert("Error sending magic link: " + error.message);
            } else {
                alert("Youve got mail!!");
            }
});

    </script>
<br>
