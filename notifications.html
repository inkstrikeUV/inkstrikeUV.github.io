<html>
<head>
  <title>Sign up</title>
  <link rel="icon" type="image/x-icon" href="pixil-frame-0 (1).ico">
  <link rel="stylesheet" href="loginstyle.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<center>
    <h1>Your Notifications</h1>
    <div id="notifications-container">
        <p id="loading-msg">Checking for updates... :3</p>
    </div>
</center>

<script>
const SUPABASE_URL = "https://cwmmlsaccrtcxagehhkt.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_PeeW6cNPzT2lo9sKgYTsJA_m2t2Wn_P";
const supabaser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadNotifications() {
    const container = document.getElementById('notifications-container');
    
    const { data: { session } } = await supabaser.auth.getSession();
    if (!session) {
        container.innerHTML = "<p>Please log in to view your notifications.</p>";
        return;
    }
    const myId = session.user.id;

    const { data: requests, error: err1 } = await supabaser
        .from('relationships')
        .select('id, id_1, profiles!relationships_id_1_fkey(username)')
        .eq('id_2', myId)
        .eq('status', 'requested');

    const { data: renames, error: err2 } = await supabaser
        .from('relationships')
        .select('id, id_1, id_2, proposed_name, namerequesterid, target:profiles!namerequesterid(username)') // <-- Changed constraint name to column name
        .eq('display_request', true)
        .or(`id_1.eq.${myId},id_2.eq.${myId}`);


    if (err1 || err2) {
        container.innerHTML = "<p>Error loading updates.</p>";
        console.error({ err1, err2 });
        return;
    }
    
    const { data: memberships, error: membershipError } =
        await supabaser
            .from('allowed_chatroom_users')
            .select(`
                chatroom_id,
                last_read_sequence,
                chatrooms!inner (
                    id,
                    privacy_type
                )
            `)
            .eq('user_id', myId)
            .eq('chatrooms.privacy_type', 'private');


    if (membershipError) {
        console.error("Could not load DM memberships:", membershipError);
    }


    const unreadDMs = [];


    if (memberships) {

        for (const membership of memberships) {

            const lastRead = membership.last_read_sequence || 0;

            const { data: unreadMessages, error: messageError } =
                await supabaser
                    .from('messages')
                    .select('id, sequence_number, sender_id, content')
                    .eq('chatroom_id', membership.chatroom_id)
                    .gt('sequence_number', lastRead)
                    .neq('sender_id', myId)
                    .order('sequence_number', { ascending: true });


            if (messageError) {
                console.error(
                    "Could not load unread messages:",
                    messageError
                );
                continue;
            }


            if (unreadMessages && unreadMessages.length > 0) {

                const newestMessage =
                    unreadMessages[unreadMessages.length - 1];

                const { data: senderProfile } =
                    await supabaser
                        .from('profiles')
                        .select('username')
                        .eq('id', newestMessage.sender_id)
                        .single();


                unreadDMs.push({
                    chatroom_id: membership.chatroom_id,
                    count: unreadMessages.length,
                    sender: senderProfile?.username || "Someone"
                });
            }
        }
    }
    container.innerHTML = "";

    const incomingRenames = renames.filter(r => r.namerequesterid !== myId); 

    if (requests.length === 0 && incomingRenames.length === 0 && unreadDMs.length === 0) {
        container.innerHTML = "<p>No new notifications right now!</p>";
        return;
    }

        unreadDMs.forEach(dm => {

        const div = document.createElement('div');

        div.className = 'notification-item';

        div.style =
            "background: rgba(143,84,255,0.2); " +
            "padding: 15px; " +
            "margin: 10px 0; " +
            "border-radius: 8px;";


        const messageText =
            dm.count === 1
                ? "sent you a new message!"
                : `sent you ${dm.count} new messages!`;


        div.innerHTML = `
            <p>
                <strong>${dm.sender}</strong> ${messageText}
            </p>

            <button
                onclick="openDM('${dm.chatroom_id}')"
                style="
                    background:#300385;
                    color:white;
                    padding:8px 14px;
                    border:none;
                    border-radius:4px;
                    cursor:pointer;
                "
            >
                Open message
            </button>
        `;

        container.appendChild(div);
    });

    requests.forEach(req => {
        const sender = req.profiles?.username || "Someone";
        const div = document.createElement('div');
        div.className = 'notification-item';
        div.style = "background: rgba(255,255,255,0.1); padding: 15px; margin: 10px 0; border-radius: 8px;";
        div.innerHTML = `
            <p><strong>${sender}</strong> wants to be your friend!</p>
            <button onclick="acceptFriend('${req.id}')" style="background:#4CAF50; padding:8px 14px; margin-right:5px; border-radius:4px;">Accept</button>
            <button onclick="rejectRelationship('${req.id}')" style="background:#f44336; padding:8px 14px; border-radius:4px;">Decline</button>
        `;
        container.appendChild(div);
    });

    incomingRenames.forEach(ren => {
        const sender = ren.target?.username || "Your friend";
        const div = document.createElement('div');
        div.className = 'notification-item';
        div.style = "background: rgba(255,255,255,0.1); padding: 15px; margin: 10px 0; border-radius: 8px;";
        div.innerHTML = `
            <p><strong>${sender}</strong> wants to change your friendship title to: <em>"${ren.proposed_name}"</em></p>
            <button onclick="acceptRename('${ren.id}', '${ren.proposed_name}')" style="background:#4CAF50; padding:8px 14px; margin-right:5px; border-radius:4px;">Approve</button>
            <button onclick="rejectRename('${ren.id}')" style="background:#f44336; padding:8px 14px; border-radius:4px;">Decline</button>
        `;
        container.appendChild(div);
    });
}
function openDM(roomId) {
    window.location.href =
        `chatroom.html?room=${encodeURIComponent(roomId)}`;
}

async function acceptFriend(id) {
    const { error } = await supabaser.from('relationships').update({ status: 'friends' }).eq('id', id);
    if (error) alert("Could not accept request: " + error.message);
    else location.reload();
}

async function rejectRelationship(id) {
    const { error } = await supabaser.from('relationships').delete().eq('id', id);
    if (error) alert("Could not remove request: " + error.message);
    else location.reload();
}

async function acceptRename(id, newName) {
    const { error } = await supabaser.from('relationships').update({ 
        display_name: newName, 
        display_request: false 
    }).eq('id', id);
    if (error) alert("Could not approve title name: " + error.message);
    else location.reload();
}

async function rejectRename(id) {
    const { error } = await supabaser.from('relationships').update({ 
        proposed_name: null, 
        display_request: false 
    }).eq('id', id);
    if (error) alert("Could not decline title change: " + error.message);
    else location.reload();
}

loadNotifications();
</script>

<footer><a href="index.html"><center>hoam :3</center></a></footer>

</html>
