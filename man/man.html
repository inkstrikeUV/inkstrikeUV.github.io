<img src="ezgif-784d121c0238d562.gif">  </button>

<script> 
    document.addEventListener("DOMContentLoaded", function() {
      function checkEggTitle() {
        if (localStorage.getItem("hasegg") === "true") {
          document.title = "* (Well, there is not a man here.)"; 
        }
      }
      checkEggTitle();

      document.getElementById("eggbutton").addEventListener("click", function() {
        if (localStorage.getItem("hasegg") === "true") {
            alert("* (Well, there is not a man here.)");
        }
        else {
        localStorage.setItem("hasegg", "true"); 
        alert("*(You received an egg.)"); 
        }
        checkEggTitle(); 
      });
  
    });
  </script>
