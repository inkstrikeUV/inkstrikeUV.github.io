async function checkExistingSession() {

        .from('profiles')           // ⚠️ Change to your exact table name
        .select('money')            // ⚠️ Change to your exact column name
        .eq('id', session.user.id)  // Match the logged-in user
        .single();                  // Get just one row

      if (fetchError) throw fetchError;

      // 2. UPDATE THE HTML DISPLAY
      if (data) {
        money = data.money; // Keep your tracking variable in sync
        document.getElementById("money-display").innerText = money;
      }

    } else {
      window.location.href = "../index.html";
    }
  } catch (err) {
    console.error("Error fetching balance:", err.message);
    document.getElementById("money-display").innerText = "Error";
  }
}
